<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong · Game Arcade</title>
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../index.html">← All games</a>
    <h1>Pong</h1>
    <p id="status" class="status"></p>
    <!-- The score is painted on the canvas, which a screen reader cannot read.
         This carries it for them and is never shown. -->
    <p id="score-reader" class="visually-hidden" aria-live="polite">You 0, AI 0</p>
    <div class="board-wrap">
      <canvas id="board" width="600" height="400" aria-label="Pong game board"></canvas>
      <!-- Real buttons rather than shapes painted on the canvas: keyboard focus,
           tab order and screen-reader support all come free, and canvas pixels
           have none of it. -->
      <div id="menu" class="menu" hidden>
        <p id="menu-heading" class="menu-heading"></p>
        <div id="difficulty" class="difficulty" role="radiogroup" aria-label="Difficulty">
          <button type="button" class="btn secondary" role="radio"
                  aria-checked="false" data-level="easy">Easy</button>
          <button type="button" class="btn secondary" role="radio"
                  aria-checked="true" data-level="medium">Medium</button>
          <button type="button" class="btn secondary" role="radio"
                  aria-checked="false" data-level="hard">Hard</button>
        </div>
        <button id="play" class="btn">Play</button>
      </div>
    </div>
    <div class="controls">
      <button id="restart" class="btn">Restart</button>
      <button id="help-toggle" class="btn secondary icon" title="How to play"
              aria-expanded="false" aria-controls="instructions"
              aria-label="How to play">?</button>
    </div>
    <div id="instructions" class="instructions" hidden>
      <ul>
        <li><b>W</b>/<b>S</b> or <b>↑</b>/<b>↓</b> — move your paddle</li>
        <li><b>Mouse</b> — move the pointer over the board to steer</li>
        <li><b>Space</b> or <b>click the board</b> — serve</li>
        <li><b>Esc</b> or <b>P</b> — pause and resume</li>
      </ul>
      <p>
        First to <span id="win-score">5</span> wins. After a point the ball is
        served back at whoever conceded it.
      </p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
