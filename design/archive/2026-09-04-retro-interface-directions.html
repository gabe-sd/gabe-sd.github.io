  align-items: flex-end;
  gap: 1rem;
  flex-wrap: wrap;
  padding-bottom: 0.85rem;
  border-bottom: 1px solid var(--hair);
  box-shadow: 0 1px 12px rgba(0, 229, 255, 0.12);
}

/* Chrome, the way an arcade marquee does it: a vertical gradient with a hard
 * break at the middle (the horizon reflected in polished metal), cool white
 * above, warm gold below. Orbitron finally earns its keep here — a wide techno
 * face is right for exactly one word on a sign and wrong for everything else,
 * so it appears in precisely four places on this page and never in body copy.
 *
 * The bloom is a filter and not a text-shadow: with -webkit-text-fill-color
 * transparent a text-shadow shows *through* the glyph and turns the chrome to
 * mud. drop-shadow works on the composited result instead. */
#v-neon .brand {
  font-family: 'Orbitron', 'Space Grotesk', sans-serif;
  font-weight: 900;
  font-size: clamp(1.5rem, 4.4vw, 2.35rem);
  letter-spacing: 0.06em;
  line-height: 1.1;
  background: linear-gradient(180deg,
    #ffffff 0%, #d9ecf7 22%, #8496ad 46%, #2f3b4e 50%,
    #93a8bd 55%, #ffeec4 74%, #e2ab53 89%, #7d5a25 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  filter:
    drop-shadow(0 1px 0 rgba(0, 0, 0, 0.75))
    drop-shadow(0 0 14px rgba(0, 229, 255, 0.3))
    drop-shadow(0 0 40px rgba(255, 45, 149, 0.22));
}

#v-neon .nav {
  display: flex;
  gap: 1.4rem;
  padding-bottom: 0.2rem;
}

#v-neon .nav a {
  position: relative;
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--txt-dim);
  text-decoration: none;
  padding-bottom: 0.3rem;
  transition: color 0.15s ease, text-shadow 0.15s ease;
}

#v-neon .nav a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--magenta);
  opacity: 0;
  transition: opacity 0.15s ease;
}

#v-neon .nav a:hover { color: var(--cyan); text-shadow: var(--tube-c); }

/* Magenta = the one you are on. Underlined as well as coloured, so the state
 * is not carried by hue alone. */
#v-neon .nav a.active { color: #ffd6e9; text-shadow: var(--tube-m); }
#v-neon .nav a.active::after {
  opacity: 1;
  box-shadow: 0 0 8px var(--magenta), 0 0 20px rgba(255, 45, 149, 0.5);
}

#v-neon .strap {
  margin: 0.85rem 0 1.7rem;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--cyan-soft);
  text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
}

/* ------------------------------------------------------------------ grid */

#v-neon .grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.85rem;
}

/* Dark glass: a panel barely lighter than the room, a top-edge highlight where
 * the light catches the bevel, and one hairline outline. Everything that makes
 * this readable — the icon well, the three-column split, the rule — is
 * geometry, and survives the tubes being switched off. */
#v-neon .tile {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas:
    "ico name num"
    "ico desc desc"
    "ico cat  cat";
  column-gap: 0.9rem;
  align-items: start;
  padding: 0.95rem 1rem 0.9rem;
  border-radius: 4px;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.008) 60%),
    var(--panel);
  box-shadow:
    inset 0 0 0 1px var(--hair),
    inset 0 1px 0 rgba(255, 255, 255, 0.07);
  color: var(--txt);
  text-decoration: none;
  transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
}

/* The tube along the top edge of the tile. Dark until the tile is chosen —
 * this is the "warming up", and it is the main non-colour selection signal. */
#v-neon .tile::before {
  content: "";
  position: absolute;
  left: 1rem;
  right: 1rem;
  top: 0;
  height: 2px;
  border-radius: 2px;
  background: rgba(0, 229, 255, 0.18);
  transition: background 0.16s ease, box-shadow 0.16s ease, left 0.16s ease, right 0.16s ease;
}

#v-neon .tico {
  grid-area: ico;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 3px;
  background: var(--well);
  box-shadow: inset 0 0 0 1px var(--hair-soft);
  color: var(--cyan-soft);
  transition: color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}

#v-neon .ico { width: 32px; height: 32px; }

#v-neon .tname {
  grid-area: name;
  font-size: 0.96rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #fdfbff;
  align-self: center;
}

/* Kept, not hidden. The tiles are big enough to carry a line of real copy, and
 * a page of nothing but tracked caps is a page you cannot actually read. */
#v-neon .tdesc {
  grid-area: desc;
  display: block;
  margin-top: 0.15rem;
  font-size: 0.79rem;
  line-height: 1.4;
  color: var(--txt-dim);
}

#v-neon .tcat {
  grid-area: cat;
  margin-top: 0.5rem;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--cyan-soft);
}

/* Space Grotesk, not Orbitron: Orbitron's zero is slashed, so "01" came out
 * "Ø1" six times down the grid and read as a glitch rather than a catalogue
 * number. Orbitron keeps the slash where it belongs — the Pong score. */
#v-neon .tnum {
  grid-area: num;
  display: block;
  font-weight: 700;
  font-size: 0.76rem;
  letter-spacing: 0.1em;
  color: rgba(190, 178, 218, 0.88);
  font-variant-numeric: tabular-nums;
  transition: color 0.16s ease;
}

/* Lit. Hover, focus and selection are one state here, because the gallery
 * selects on hover — so there is a single "chosen" look and it is
 * unmistakable: the tube strikes, the glass lifts and lightens, the outline
 * goes magenta and the icon well warms. Four signals, one of them colour. */
#v-neon .tile:hover,
#v-neon .tile:focus-visible,
#v-neon .tile.is-selected {
  outline: none;
  transform: translateY(-2px);
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 45, 149, 0.05) 70%),
    var(--panel-lit);
  box-shadow:
    inset 0 0 0 1px rgba(255, 45, 149, 0.85),
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 0 22px rgba(255, 45, 149, 0.12),
    0 0 16px rgba(255, 45, 149, 0.32),
    0 0 44px rgba(255, 45, 149, 0.16);
}

#v-neon .tile:hover::before,
#v-neon .tile:focus-visible::before,
#v-neon .tile.is-selected::before {
  left: 0.35rem;
  right: 0.35rem;
  background: #ffd9ec;
  box-shadow: 0 0 6px var(--magenta), 0 0 16px rgba(255, 45, 149, 0.7),
              0 0 38px rgba(255, 45, 149, 0.35);
}

#v-neon .tile:hover .tico,
#v-neon .tile:focus-visible .tico,
#v-neon .tile.is-selected .tico {
  color: #ffffff;
  background: #1d0f2c;
  box-shadow: inset 0 0 0 1px rgba(255, 45, 149, 0.5), inset 0 0 18px rgba(255, 45, 149, 0.2);
}

#v-neon .tile:hover .tnum,
#v-neon .tile:focus-visible .tnum,
#v-neon .tile.is-selected .tnum { color: #ffc9e2; }

#v-neon .tile:hover .tcat,
#v-neon .tile:focus-visible .tcat,
#v-neon .tile.is-selected .tcat { color: #ff8ec2; opacity: 1; }

/* ------------------------------------------------------------ info panel */

#v-neon .info {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas:
    "label cta"
    "name  cta"
    "meta  cta"
    "desc  cta";
  align-items: start;
  column-gap: 1.5rem;
  margin-top: 1.6rem;
  padding: 1.05rem 1.3rem 1.1rem 1.5rem;
  border-radius: 4px;
  background:
    linear-gradient(170deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.01) 65%),
    var(--panel);
  box-shadow: inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(255, 255, 255, 0.07);
}

/* The lit bar down the left edge: this panel is the continuation of whichever
 * tile is chosen, so it carries the same magenta. */
#v-neon .info::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.6rem;
  bottom: 0.6rem;
  width: 3px;
  border-radius: 3px;
  background: var(--magenta);
  box-shadow: 0 0 10px rgba(255, 45, 149, 0.7), 0 0 30px rgba(255, 45, 149, 0.3);
}

#v-neon .ilabel {
  grid-area: label;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  color: var(--cyan);
}

#v-neon .inm {
  grid-area: name;
  margin-top: 0.25rem;
  font-family: 'Orbitron', 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: clamp(1.25rem, 3.2vw, 1.75rem);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #f4fdff;
  text-shadow: var(--tube-c);
}

#v-neon .imeta {
  grid-area: meta;
  margin-top: 0.3rem;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--cyan-soft);
}

#v-neon .idesc {
  grid-area: desc;
  margin-top: 0.35rem;
  font-size: 0.92rem;
  color: var(--txt);
}

#v-neon .icta {
  grid-area: cta;
  align-self: center;
  padding: 0.6rem 1.15rem;
  border-radius: 3px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  white-space: nowrap;
  color: #ffe2f0;
  /* 0.14 rather than the 0.09 this started at. With every shadow switched off
   * the CTA was the one element that vanished — its edge was entirely an inset
   * box-shadow — so the fill has to be enough to read as a button on its own. */
  background: rgba(255, 45, 149, 0.14);
  box-shadow: inset 0 0 0 1px rgba(255, 45, 149, 0.8), 0 0 14px rgba(255, 45, 149, 0.28);
  text-shadow: var(--tube-m);
}

/* A tube striking: two failed attempts, then it holds. */
#v-neon .info.is-launching .icta { animation: neon-strike 0.7s steps(1, end) 1; }

@keyframes neon-strike {
  0%, 8%    { background: rgba(255, 45, 149, 0.92); color: #1a0410; text-shadow: none; }
  9%, 20%   { background: rgba(255, 45, 149, 0.04); color: #6b3350; text-shadow: none; }
  21%, 30%  { background: rgba(255, 45, 149, 0.92); color: #1a0410; text-shadow: none; }
  31%, 38%  { background: rgba(255, 45, 149, 0.04); color: #6b3350; text-shadow: none; }
  39%, 100% { background: rgba(255, 45, 149, 0.95); color: #1a0410; text-shadow: none; }
}

@media (prefers-reduced-motion: reduce) {
  #v-neon .tile { transition: none; }
  #v-neon .info.is-launching .icta {
    animation: none;
    background: rgba(255, 45, 149, 0.95);
    color: #1a0410;
    text-shadow: none;
  }
}

/* ---------------------------------------------------------- game samples */

#v-neon .sample { margin-top: 2.4rem; }

#v-neon .sample-h {
  margin: 0 0 0.8rem;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--txt-dim);
}

#v-neon .sample-row { display: flex; flex-wrap: wrap; gap: 0.85rem; align-items: flex-start; }

#v-neon .sbox {
  flex: 0 0 auto;
  padding: 0.8rem 0.9rem 0.95rem;
  border-radius: 4px;
  background:
    linear-gradient(170deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.008) 65%),
    var(--panel);
  box-shadow: inset 0 0 0 1px var(--hair-soft), inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

#v-neon .sbox-h {
  display: block;
  margin-bottom: 0.6rem;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--cyan);
}

/* Sudoku. The board sits in a well cut into the glass — darker than the panel,
 * so the numbers have their own ground and the panel's sheen is not behind
 * them. */
/* max-content on both boards: the cell tracks are fixed, but the container is
 * a block, so once the .sbox went full-width under 700px the grid's own
 * background — the cyan gap colour — painted the whole remaining row as a slab
 * with the board huddled at one end. */
#v-neon .sgrid {
  display: grid;
  width: max-content;
  grid-template-columns: repeat(3, 32px);
  gap: 1px;
  background: rgba(0, 229, 255, 0.2);
  box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.2);
}

#v-neon .scell {
  height: 32px;
  display: grid;
  place-items: center;
  background: var(--well);
  font-family: 'Orbitron', monospace;
  font-weight: 500;
  font-size: 0.95rem;
  color: var(--txt);
}

#v-neon .scell.given { color: #ffffff; }
#v-neon .scell.entered { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }

/* The cursor is magenta because it is the singled-out cell — the same rule as
 * the selected tile. Boxed as well as coloured. */
#v-neon .scell.sel {
  background: #23092a;
  box-shadow: inset 0 0 0 1px var(--magenta), inset 0 0 10px rgba(255, 45, 149, 0.3);
}

#v-neon .mgrid {
  display: flex;
  width: max-content;
  gap: 1px;
  background: rgba(0, 229, 255, 0.2);
  box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.2);
}

#v-neon .mcell {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: var(--well);
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  font-size: 0.9rem;
}

/* Eight numbers on a violet-black ground.
 *
 * Hue first, brightness second: eight steps of brightness alone collapse the
 * moment two of them are adjacent, so these are eight *hues* spaced round the
 * wheel, with lightness varied only to keep neighbours apart. They are drawn
 * from colours real gas tubes come in — cyan, argon green, gold, ice, orange,
 * white, lavender, ruby — which is what keeps the set feeling like one sign
 * rather than a swatch library.
 *
 * WHICH ONES GLOW: only 5–8. On a real board 1 and 2 are most of what is on
 * screen, and four hundred glowing 1s is a smear, not a board — that is the
 * failure this variant is most exposed to. So the common numbers are flat and
 * sharp, and only the rare high ones are lit, which is also useful: the number
 * that means "you are in trouble" is the one that catches the eye. The glow on
 * those is a single tight ring, not the full four-layer tube. */
#v-neon .n1 { color: #00e5ff; }                       /* cyan */
#v-neon .n2 { color: #4dff9e; }                       /* argon green */
#v-neon .n3 { color: #ffd23f; }                       /* gold */
#v-neon .n4 { color: #8fb0e8; }                       /* ice — paler and greyer
                                                       * than n1 on purpose, so
                                                       * the two blues do not

#v-neon .n5 { color: #ff7a3d; text-shadow: 0 0 7px rgba(255, 122, 61, 0.55); }
#v-neon .n6 { color: #ffffff; text-shadow: 0 0 7px rgba(200, 230, 255, 0.6); }
#v-neon .n7 { color: #c9a0ff; text-shadow: 0 0 7px rgba(201, 160, 255, 0.6); }
#v-neon .n8 { color: #ff3b5c; text-shadow: 0 0 8px rgba(255, 59, 92, 0.7); }

/* Magenta again, and for the same reason: a flag is a cell you have singled
 * out. Nothing else on a Minesweeper board is allowed this colour. */
#v-neon .mcell.flag { color: var(--magenta); text-shadow: var(--tube-m); }

#v-neon .mcell.hidden-cell {

    var(--panel-lit);

#v-neon .pscore {

/* ===== variants/brutal.css ===== */
/* 11 — Signal
 *
 * The full departure. No icons, no texture, no glow, no gradient, no rounded
 * corner, no second colour. What is left is type, rule weight, alignment and
 * one signal orange used only where something is live or selected.
 *
 * The six games stop being a grid of cards and become a numbered index. The
 * numbers gallery.js already supplies ("01"–"06") are the visual device that
 * replaces the icon, set at twice the size of the game's own name so they are
 * structure rather than a label in a corner.
 *
 * The whole interaction language is inversion: a live row flips to a solid
 * accent block with the ground colour as its text. There is no hover glow, no
 * border colour change, no lift. One state, and it is unmistakable.
 */

#v-brutal {
  --bg: #0b0b0b;
  --fg: #f5f5f0;
  --fg-2: #b9b9b2;          /* secondary text — 9.9:1 on the ground */
  --fg-3: #8b8b85;          /* the dimmest text allowed anywhere — 5.8:1 */
  --rule: #2a2a26;          /* hairline */
  --rule-2: #45453f;        /* box edge, one step up so a border is not a hairline */
  --block: #2e2e2a;         /* an unrevealed / inert solid */
  --accent: #ff3b00;        /* live or selected. Nowhere else. */

  /* The one strong margin. Everything on the page hangs off it, including the
   * spine drawn in .deco. */
  --m: clamp(1.25rem, 4vw, 3.4rem);

  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Mono', ui-monospace, monospace;
  font-size: 16px;
  line-height: 1.35;
}

/* The margin made visible: a single hairline running the full height, with the
 * text hanging off it. Not an ornament — it is the one alignment the layout
 * has, drawn. Rejected: making this spine 3px and accent-coloured. It looked
 * decisive and it spent the accent on furniture, which is the one thing this
 * direction cannot afford. */
#v-brutal .deco {
  inset: 0 auto 0 calc(var(--m) - 0.85rem);
  width: 1px;
  background: var(--rule);
}

/* Left-aligned, not centred: max-width with no auto margin, so the column
 * hangs on the left edge at any viewport width. Nothing on this page is
 * centred, including the page itself. */
#v-brutal .screen {
  max-width: 1340px;
  margin: 0;
  padding: 2.4rem var(--m) 4rem;
}

/* -------------------------------------------------------------- wordmark */

/* The header stacks rather than splitting left/right: a right-aligned nav
 * would give the page a second margin, and there is only one. */
#v-brutal .top {
  display: block;
  padding-bottom: 1.1rem;
}

#v-brutal .brand {
  display: block;
  font-family: 'Archivo Black', 'Space Grotesk', sans-serif;
  font-size: clamp(2.6rem, 9vw, 6.2rem);
  line-height: 0.86;
  letter-spacing: -0.038em;   /* tight enough that the two words read as a mass */
  text-transform: uppercase;
  color: var(--fg);
}

#v-brutal .nav {
  display: flex;
  gap: 1.6rem;
  margin-top: 1.1rem;
}

#v-brutal .nav a {
  position: relative;
  padding-bottom: 0.3rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--fg-3);
  border-bottom: 3px solid transparent;
}

#v-brutal .nav a:hover,
#v-brutal .nav a:focus-visible { color: var(--fg); border-bottom-color: var(--fg); outline: none; }

/* The current page is live, so it gets the accent — and a 3px rule under it,
 * so the state survives being read in greyscale. */
#v-brutal .nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

#v-brutal .strap {
  margin: 0 0 2.1rem;
  font-size: 1.02rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-2);
}

/* ----------------------------------------------------------------- index */

/* A list, not a grid. gallery.css defaults this to auto-fill cards with a 1rem
 * gap; both have to go or the rules stop touching and the rhythm dies. */
#v-brutal .grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  border-top: 3px solid var(--fg);
}

#v-brutal .tile {
  display: grid;
  grid-template-columns: 6.6rem minmax(0, 1fr);
  grid-template-areas:
    "num name"
    "num cat"
    "num desc";
  column-gap: 1.4rem;
  align-items: start;

  /* The row bleeds 0.85rem left of the text so that when it inverts, the solid
   * block lands exactly on the spine. */
  margin-left: -0.85rem;
  padding: 1.15rem 0.85rem 1.25rem;
  border-bottom: 1px solid var(--rule);
  color: var(--fg);
  text-decoration: none;
  transition: background 0.09s steps(2), color 0.09s steps(2), padding-left 0.09s ease;
}

#v-brutal .tile:last-child { border-bottom: 3px solid var(--fg); }

/* No icon at all in this direction, so the slot is closed rather than left
 * holding an empty box. */
#v-brutal .tico { display: none; }

/* The device that replaces the icon. Twice the size of the name it belongs to,
 * so it is composition rather than annotation. A spanning grid item does not
 * take part in baseline alignment, so the cap heights are matched by hand:
 * line-height 0.8 plus a 0.08rem nudge lines it up with .tname. */
#v-brutal .tnum {
  display: block;
  grid-area: num;
  align-self: start;
  margin-top: 0.22rem;
  font-family: 'Archivo Black', 'Space Grotesk', sans-serif;
  font-size: 4.2rem;
  line-height: 0.8;
  letter-spacing: -0.04em;
  color: #a8a8a1;
}

#v-brutal .tname {
  grid-area: name;
  align-self: start;
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}

/* Kept in the tile rather than hidden. There is no icon doing the explaining
 * here, so the sentence has to. */
#v-brutal .tdesc {
  grid-area: desc;
  margin-top: 0.34rem;
  font-size: 0.82rem;
  letter-spacing: 0.01em;
  color: var(--fg-2);
}

/* The category is a typographic label, not a colour. Rejected: an accent per
 * data-cat — three colours in a system whose entire argument is that there is
 * one. */
#v-brutal .tcat {
  grid-area: cat;
  align-self: start;
  margin-top: 0.5rem;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  color: var(--fg-3);
}

/* Inversion, and an indent. Two cues, and the indent is the one that survives
 * a greyscale print or a colour-blind reader. */
#v-brutal .tile:hover,
#v-brutal .tile:focus-visible,
#v-brutal .tile.is-selected {
  background: var(--accent);
  color: var(--bg);
  padding-left: 1.6rem;
  outline: none;
}

/* Everything on the inverted row is solid ground colour. Rejected: alpha on
 * the secondary text — rgba(11,11,11,0.72) over the accent blends to about
 * #4f1808, roughly 4:1, which is under the bar at 0.82rem. Hierarchy on this
 * row is size and weight only. */
#v-brutal .tile:hover .tnum,
#v-brutal .tile:focus-visible .tnum,
#v-brutal .tile.is-selected .tnum,
#v-brutal .tile:hover .tdesc,
#v-brutal .tile:focus-visible .tdesc,
#v-brutal .tile.is-selected .tdesc,
#v-brutal .tile:hover .tcat,
#v-brutal .tile:focus-visible .tcat,
#v-brutal .tile.is-selected .tcat { color: var(--bg); }

/* ------------------------------------------------------------ info panel */

/* No rule of its own: the 3px that closes the index is the rule above this
 * panel. Two parallel 3px rules a rem apart read as an accident, not a
 * device. */
#v-brutal .info {
  display: block;
  margin-top: 2.4rem;
}

#v-brutal .ilabel {
  display: block;
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--fg-3);
}

#v-brutal .inm {
  display: block;
  margin-top: 0.45rem;
  font-family: 'Archivo Black', 'Space Grotesk', sans-serif;
  font-size: clamp(1.9rem, 4.6vw, 3rem);
  line-height: 0.95;
  letter-spacing: -0.035em;
  text-transform: uppercase;
}

#v-brutal .imeta {
  display: block;
  margin-top: 0.55rem;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  color: var(--fg-2);
}

#v-brutal .idesc {
  display: block;
  margin-top: 0.4rem;
  font-size: 0.95rem;
  color: var(--fg-2);
}

/* The solid block the composition needs against the hairlines — but white, not
 * accent. The selected row above is already an orange block; two of them a few
 * hundred pixels apart is how a scarce colour stops being scarce. */
#v-brutal .icta {
  display: inline-block;
  margin-top: 1.15rem;
  padding: 0.5rem 1.15rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  color: var(--bg);
  background: var(--fg);
}

/* Launching is the one moment the CTA is live, so that is when it takes the
 * accent. steps(1) because nothing here fades. */
#v-brutal .info.is-launching .icta { animation: brutal-launch 0.14s steps(1) 5; }
@keyframes brutal-launch { 50% { background: var(--accent); color: var(--bg); } }

/* --------------------------------------------------------- game samples */

#v-brutal .sample {
  margin-top: 3rem;
  padding-top: 1.1rem;
  border-top: 3px solid var(--fg);
}

#v-brutal .sample-h {
  margin: 0 0 1.4rem;
  font-family: 'Archivo Black', 'Space Grotesk', sans-serif;
  font-size: 1.15rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}

#v-brutal .sample-row { display: flex; flex-wrap: wrap; gap: 2.2rem; align-items: flex-start; }

#v-brutal .sbox { flex: 0 0 auto; }

#v-brutal .sbox-h {
  display: block;
  margin-bottom: 0.7rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--rule);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--fg-3);
}

/* Sudoku: given and entered are told apart by weight, exactly as n3 and n4 are
 * in the mine grid below. The only accent in this box is the selected cell,
 * because selection is what the accent means. */
#v-brutal .sgrid {
  display: grid;
  grid-template-columns: repeat(3, 2.6rem);
  gap: 1px;
  background: var(--rule-2);
  border: 1px solid var(--rule-2);
}

#v-brutal .scell {
  height: 2.6rem;
  display: grid;
  place-items: center;
  background: var(--bg);
  font-size: 1.15rem;
}

/* Given and entered are told apart by weight and one grey step — the same two
 * devices as n3/n4 below, rather than a new one. Givens are the fixed half of
 * the puzzle, so they are the heavier of the two. */
#v-brutal .scell.given { color: var(--fg); font-weight: 700; }
#v-brutal .scell.entered { color: var(--fg-2); font-weight: 400; }
#v-brutal .scell.sel { background: var(--accent); color: var(--bg); }

/* Eight numbers, one colour.
 *
 * The obvious answer — eight hues — would break the only rule this direction
 * has, and a plain brightness ramp cannot carry eight steps apart. So the
 * numbers escalate the way the game itself does: 1 is nearly nothing, 8 is the
 * loudest thing on the board. Four devices stacked in order —
 *   grey step (1,2,3) → weight (4) → rule (5) → box (6) → inversion (7,8)
 * — with the accent spent on 8 alone, the one that is genuinely dangerous.
 * Every step is a different *shape*, so the set survives greyscale, and no two
 * adjacent numbers share a device. */
#v-brutal .mgrid {
  display: grid;
  grid-template-columns: repeat(10, 2.6rem);
  gap: 1px;
  background: var(--rule-2);
  border: 1px solid var(--rule-2);
}

#v-brutal .mcell {
  height: 2.6rem;
  display: grid;
  place-items: center;
  background: var(--bg);
  font-size: 1.15rem;
  line-height: 1;
}

#v-brutal .n1 { color: #808079; }
#v-brutal .n2 { color: #b0b0a9; }
#v-brutal .n3 { color: var(--fg); }
#v-brutal .n4 { color: var(--fg); font-weight: 700; }
/* The rule goes under the glyph rather than across the bottom of the cell —
 * an inset box-shadow sat on the grid line and read as a border, not a mark. */
#v-brutal .n5 {
  color: var(--fg);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 0.16em;
}
#v-brutal .n6 { color: var(--fg); font-weight: 700; box-shadow: inset 0 0 0 2px var(--fg); }
#v-brutal .n7 { color: var(--bg); font-weight: 700; background: var(--fg); }
#v-brutal .n8 { color: var(--bg); font-weight: 700; background: var(--accent); }

/* The unrevealed square is the raised one, so in a flat system it is the solid
 * and the revealed squares are bare ground. Same inversion language, no new
 * device. The flag is a white glyph on it — 8 owns the accent in this box. */
#v-brutal .mcell.hidden-cell { background: var(--block); }
#v-brutal .mcell.flag { color: var(--fg); background: var(--block); }

/* Pong: the score is set at display size because a score is the one number a
 * player actually looks at. */
#v-brutal .pbar {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}

#v-brutal .pscore {
  font-family: 'Archivo Black', 'Space Grotesk', sans-serif;
  font-size: 2.4rem;
  line-height: 0.9;
  letter-spacing: -0.04em;
}

#v-brutal .plabel {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.26em;
  color: var(--fg-3);
}

#v-brutal .pdiv { flex: 0 0 2rem; height: 3px; background: var(--fg); align-self: center; }

#v-brutal .pcourt {
  position: relative;
  width: 15rem;
  height: 4.6rem;
  margin-top: 0.9rem;
  border: 1px solid var(--rule-2);
}

#v-brutal .pcourt::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0.35rem;
  bottom: 0.35rem;
  border-left: 1px dashed var(--rule-2);
}

#v-brutal .ppad { position: absolute; width: 4px; height: 1.6rem; background: var(--fg); }
#v-brutal .ppad.l { left: 0.5rem; top: 0.7rem; }
#v-brutal .ppad.r { right: 0.5rem; top: 2.1rem; }

/* The ball is the live thing on the court, so it is the accent, and it is the
 * only accent in this box. */
#v-brutal .pball {
  position: absolute;
  left: 62%;
  top: 1.9rem;
  width: 0.55rem;
  height: 0.55rem;
  background: var(--accent);
}

/* ------------------------------------------------------------------ foot */

#v-brutal .foot {
  margin-top: 3rem;
  padding-top: 0.9rem;
  border-top: 1px solid var(--rule);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #a5a59e;
}

/* ------------------------------------------------------------ narrow ---- */

@media (max-width: 720px) {
  #v-brutal .tile {
    grid-template-columns: 4.4rem minmax(0, 1fr);
    column-gap: 0.9rem;
  }
  #v-brutal .tnum { font-size: 2.9rem; }
  #v-brutal .tname { font-size: 1.25rem; }
  #v-brutal .tcat { margin-top: 0.45rem; font-size: 0.58rem; letter-spacing: 0.18em; }
  #v-brutal .tdesc { margin-top: 0.3rem; }
  #v-brutal .mgrid { grid-template-columns: repeat(5, 2.6rem); }
  #v-brutal .pcourt { width: 100%; max-width: 15rem; }
}

@media (prefers-reduced-motion: reduce) {
  #v-brutal .tile { transition: none; }
  #v-brutal .info.is-launching .icta { animation: none; }
}

<script>

/* Preview gallery for the redesign's first phase.
 *
 * Throwaway. This is not the site and none of it is meant to be ported: it
 * exists so a whole visual direction can be looked at rather than described.
 * The real work goes into shared.css, hub.css and the hub's index.html once
 * one of these is chosen.
 *
 * Every variant gets identical content and identical structure. Only the
 * stylesheet in variants/<id>.css differs, which is the point: what you are
 * comparing is the design, not the copy.
 */

/* ---------------------------------------------------------------- content */

/* The six real games. Descriptions are copied verbatim from the hub —
 * visitor-facing prose is Gabriel's and is not the art director's to rewrite. */
const GAMES = [
  { id: 'tic-tac-toe', name: 'Tic Tac Toe', desc: 'Classic 3x3, two players', cat: 'strategy', players: '2 PLAYERS', icon: 'ttt' },
  { id: 'pong', name: 'Anime Pong', desc: 'You vs. the AI paddle', cat: 'arcade', players: '1 PLAYER', icon: 'pong' },
  { id: 'minesweeper', name: 'Minesweeper', desc: 'Clear the board, avoid the mines', cat: 'puzzle', players: '1 PLAYER', icon: 'mine' },
  { id: 'chess', name: 'Chess', desc: 'Full rules, two players, local pass-and-play', cat: 'strategy', players: '2 PLAYERS', icon: 'chess' },
  { id: 'flappy-bird', name: 'Flappy Bird', desc: 'Flap through the pipes, one tap at a time', cat: 'arcade', players: '1 PLAYER', icon: 'bird' },
  { id: 'sudoku', name: 'Sudoku', desc: 'Fill the grid, no repeats in any row, column, or box', cat: 'puzzle', players: '1 PLAYER', icon: 'sudoku' },
];

/* ------------------------------------------------------------------ icons */

/* Stroke icons, drawn on one 48x48 grid at a single weight so the set reads as
 * a set. They inherit colour through currentColor. */
const LINE_ICONS = {
  ttt: `<g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">

/* The same six as pixel art, for the variants where a drawn curve would be a
 * lie about the display they are imitating. '#' is a lit pixel. */
const PIXEL_ICONS = {
  ttt: ['..#..#..', '..#..#..', '########', '..#..#..', '..#..#..', '########', '..#..#..', '..#..#..'],
  pong: ['........', '#...#...', '#...#..#', '#...#..#', '#.#.#..#', '....#..#', '....#...', '........'],
  mine: ['......#.', '..###.#.', '.#####..', '#######.', '#######.', '#######.', '.#####..', '..###...'],
  chess: ['..###...', '..###...', '...#....', '..###...', '.#####..', '..###...', '.#####..', '#######.'],
  bird: ['........', '..####..', '.#.#.##.', '.######.', '########', '.#####..', '..###...', '........'],
  sudoku: ['########', '#.#..#.#', '#.#..#.#', '########', '#.#..#.#', '#.#..#.#', '########', '........'],
};

function lineIcon(name) {
  return `<svg class="ico" viewBox="0 0 48 48" aria-hidden="true">${LINE_ICONS[name]}</svg>`;
}

function pixelIcon(name) {
  const rows = PIXEL_ICONS[name];
  const w = rows[0].length;
  const h = rows.length;
  let r = '';
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (rows[y][x] === '#') r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
  }
  return `<svg class="ico" viewBox="0 0 ${w} ${h}" aria-hidden="true" shape-rendering="crispEdges"><g fill="currentColor">${r}</g></svg>`;
}

function iconFor(kind, game) {
  if (kind === 'pixel') return pixelIcon(game.icon);
  if (kind === 'none') return '';
  return lineIcon(game.icon);
}

/* ------------------------------------------------------------------ parts */

function tileHTML(v, g, i) {
  return `<a class="tile" href="#" data-i="${i}" data-cat="${g.cat}">
    <span class="tico">${iconFor(v.icons, g)}</span>
    <span class="tname">${g.name}</span>
    <span class="tdesc">${g.desc}</span>
    <span class="tcat">${g.cat.toUpperCase()}</span>
    <span class="tnum">${String(i + 1).padStart(2, '0')}</span>

}

function infoHTML(v) {

function referenceHTML() {
  const block = (r) => `
    <section class="ref-item">
      <h3><a href="#${r.id}" class="ref-jump">${r.name}</a></h3>
      <div class="ref-sw">${r.swatches.map(([hex, role]) => `
        <span class="ref-chip">
          <b style="background:${hex}"></b>
          <code>${hex}</code>
          <i>${role}</i>
        </span>`).join('')}</div>
      <p class="ref-type"><b>Type.</b> ${r.type}</p>
      ${r.numbers ? `<p class="ref-nums"><b>Minesweeper 1–8.</b>
        ${r.numbers.map((h, i) => `<span class="ref-num" style="color:${h}">${i + 1}</span>`).join('')}
        <span class="ref-hexes">${r.numbers.join(' · ')}</span></p>` : ''}
      <p class="ref-note">${r.note}</p>
    </section>`;

  return `
  <div class="intro ref">
    <h1>Retro interface reference</h1>
    <p class="intro-lede">Thirteen complete interface directions, with the values behind each one:
    the palette as copyable hexes, the typefaces and the scale, and how each solved the hardest
    problem in the set — eight Minesweeper numbers that have to stay apart from each other and
    legible on the ground. Every hex here is one the direction actually uses. Click a name to see
    it built.</p>

    <h2>What generalises, whatever you are building</h2>
    <ul class="intro-find">
      <li><b>A pixel typeface carries less colour than the contrast maths predicts.</b> VT323's
      strokes are one pixel wide, so a colour that clears 4.5:1 as a solid glyph can still vanish.
      The usable bottom of a ramp sits about two steps above where the numbers say it does.</li>
      <li><b>Eight distinguishable values do not exist inside one hue.</b> Five of these arrived at
      that independently: you get five or six steps, and the rest need a second <i>device</i> — an
      underline, an inverted cell, a dithered field, a border, a weight change.</li>
      <li><b>A scanline is the dark gap between lines, not the line.</b> A white stripe over a
      near-black page has nothing to lighten and is invisible. Draw the gap.</li>
      <li><b>Scanline texture has a density ceiling.</b> A 1.5px dark line every 3.5px cuts two
      bands through a glyph at normal board sizes and saturated mid-tones fragment. Light texture
      is free; heavy texture costs about 35% more glyph size to stay readable.</li>
      <li><b>Chrome and other gradient-filled text takes <code>filter: drop-shadow</code></b>, never
      <code>text-shadow</code> — with a transparent fill the shadow draws through the glyph.</li>
      <li><b>An accent borrowed from a palette with a different ground is a starting point, not a
      value.</b> Amber Arcade took its guest hues from the two cold directions and not one survived
      the move: <code>#3fd4ff</code> on a brown-black <code>#0a0704</code> reads as a hole punched
      through to another page, because a 100%-blue cyan has nothing in common with a ground whose
      blue channel is almost gone. Every one moved a few points of red and green and a step
      lighter.</li>
      <li><b>Separate the costume from the information.</b> Two directions here arrived at the same
      split independently and it is the most portable thing in the set: the <i>chrome</i> is the
      machine — frame, wordmark, rules, the panel a thing sits in — and the <i>screen</i> is the
      content someone has to decode. Display effects (a single hue, scanline texture, bloom) belong
      to the chrome and are kept off the screen. It is what lets a heavily styled shell sit around
      genuinely legible content instead of fighting it.</li>
    </ul>

    <h2>The thirteen</h2>
    ${REFERENCE.map(block).join('')}

    <p class="intro-foot">Built as a design review for the arcade's redesign, September 2026.</p>
  </div>`;
}

/* Whether a direction HAS texture, captured once from the authored value.
 *
 * `crt` is the current setting and the caption buttons write to it, so it
 * cannot also mean "this direction does texture at all" — gating the control
 * on `v.crt !== 'off'` made choosing "none" delete the control that was the
 * only way back to any other setting. A direction authored at `crt: 'off'`
 * (Vector Neon, and every non-CRT direction) still gets no control, which is
 * the distinction the original test was reaching for. */
VARIANTS.forEach((v) => { if (!v.intro) v.hasCrt = v.crt !== 'off'; });

/* ------------------------------------------------------------------ build */

const stage = document.getElementById('stage');
const tabs = document.getElementById('tabs');
const caption = document.getElementById('caption');

VARIANTS.forEach((v) => {
  const sec = document.createElement('section');
  sec.className = 'variant';
  sec.id = 'v-' + v.id;
  sec.hidden = true;

  if (v.intro) {
    sec.classList.add('is-intro');
    sec.innerHTML = v.reference ? referenceHTML() : INTRO;
    stage.appendChild(sec);
    addTab(v);
    if (v.reference) {
      sec.querySelectorAll('.ref-jump').forEach((a) => {
        a.addEventListener('click', (e) => { e.preventDefault(); show(a.getAttribute('href').slice(1)); });
      });
    }
    return;
  }

  sec.dataset.crt = v.crt;
  sec.innerHTML = `
    <div class="deco" aria-hidden="true"></div>
    <div class="screen">
      <header class="top">
        <span class="brand">${v.brand}</span>
        <nav class="nav">${v.nav.map((n, i) => `<a href="#" class="${i === 0 ? 'active' : ''}">${n}</a>`).join('')}</nav>
      </header>
      <p class="strap">${v.strap}</p>
      <div class="grid">${GAMES.map((g, i) => tileHTML(v, g, i)).join('')}</div>
      ${infoHTML(v)}
      ${sampleHTML()}
      <footer class="foot">${v.foot}</footer>
    </div>
    <div class="crt" aria-hidden="true"></div>`;
  stage.appendChild(sec);
  addTab(v);
  wireSelection(sec);
});

function addTab(v) {
  const tab = document.createElement('button');
  tab.className = 'chrome-tab';
  tab.dataset.id = v.id;
  tab.innerHTML = `<span class="tab-group">${v.group}</span>${v.name}`;
  tab.addEventListener('click', () => show(v.id));
  tabs.appendChild(tab);
}

/* Hover and focus fill the info panel; on a touch screen the first tap selects
 * and the second would launch. That two-tap behaviour is the thing Gabriel
 * wanted to try against a real page rather than decide from a description. */
function wireSelection(sec) {
  const info = sec.querySelector('.info');
  const tiles = [...sec.querySelectorAll('.tile')];
  let selected = -1;

  const select = (i) => {
    const g = GAMES[i];
    selected = i;
    tiles.forEach((t, j) => t.classList.toggle('is-selected', j === i));
    info.dataset.cat = g.cat;
    info.querySelector('.inm').textContent = g.name;
    info.querySelector('.imeta').textContent = `${g.cat.toUpperCase()} · ${g.players}`;
    info.querySelector('.idesc').textContent = g.desc;
  };

  tiles.forEach((t, i) => {
    t.addEventListener('mouseenter', () => select(i));
    t.addEventListener('focus', () => select(i));
    t.addEventListener('click', (e) => {
      e.preventDefault();
      if (selected === i) {
        info.classList.add('is-launching');
        setTimeout(() => info.classList.remove('is-launching'), 700);
      } else {
        select(i);
      }
    });
  });

  select(0);
}

/* ----------------------------------------------------------------- chrome */

let current = null;

function show(id) {
  const v = VARIANTS.find((x) => x.id === id) || VARIANTS[0];
  current = v;
  VARIANTS.forEach((x) => { document.getElementById('v-' + x.id).hidden = x.id !== v.id; });
  [...tabs.children].forEach((t) => t.classList.toggle('is-on', t.dataset.id === v.id));
  document.body.dataset.variant = v.id;
  if (location.hash.slice(1) !== v.id) history.replaceState(null, '', '#' + v.id);
  renderCaption(v);
  window.scrollTo(0, 0);
}

function renderCaption(v) {
  if (v.intro) {
    caption.innerHTML = v.reference
      ? `<div class="cap-main"><span class="cap-name">Reference</span>
         <span class="cap-pitch">The palettes, the type and the number solutions behind all
         eleven, as values rather than pictures.</span></div>`
      : `<div class="cap-main"><span class="cap-name">Preview gallery</span>
         <span class="cap-pitch">Thirteen directions for the redesign. Read this page, then use the
         tabs or the arrow keys.</span></div>`;
    return;
  }
  const n = VARIANTS.indexOf(v) - 1;
  caption.innerHTML = `
    <div class="cap-main">
      <span class="cap-n">${String(n).padStart(2, '0')}/${VARIANTS.length - 2}</span>
      <span class="cap-name">${v.name}</span>
      <span class="cap-pitch">${v.pitch}</span>
    </div>
    <div class="cap-side">
      <span class="cap-cost"><b>What it costs:</b> ${v.cost}</span>
      ${v.hasCrt ? crtControlHTML(v) : ''}
    </div>`;
  const ctl = caption.querySelector('.crt-ctl');
  if (ctl) {
    ctl.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      document.getElementById('v-' + v.id).dataset.crt = b.dataset.level;
      v.crt = b.dataset.level;
      renderCaption(v);
    });
  }
}

/* Four strengths by default. A variant may narrow the list with `crtLevels`,
 * which Cold Terminal Mk II does: dropping "heavy" is one of the three things
 * that direction is arguing for, so offering the button would let the reader
 * switch on the setting the variant exists to rule out. */
function crtControlHTML(v) {
  const ALL = [['off', 'none'], ['soft', 'subtle'], ['mock', 'as mocked'], ['heavy', 'heavy']];
  const levels = v.crtLevels ? ALL.filter(([lv]) => v.crtLevels.includes(lv)) : ALL;
  return `<span class="crt-ctl">CRT texture:
    ${levels.map(([lv, label]) => `<button data-level="${lv}" class="${v.crt === lv ? 'on' : ''}">${label}</button>`).join('')}
  </span>`;
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  const i = VARIANTS.indexOf(current);
  if (e.key === 'ArrowRight') show(VARIANTS[(i + 1) % VARIANTS.length].id);
  if (e.key === 'ArrowLeft') show(VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length].id);
});

/* The published archive opens on the reference sheet; the review copy opens on
 * the start page. The build injects __START__ for the former. */
show(location.hash.slice(1) || window.__START__ || VARIANTS[0].id);

</script>
