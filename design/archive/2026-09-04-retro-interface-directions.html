/* ===== gallery.css ===== */
/* Gallery chrome: the frame around the previews, deliberately neutral so it
 * does not colour the thing being judged. Everything here is scoped to
 * .chrome / .stage / .variant; a variant's own look lives in variants/<id>.css
 * and is scoped to its section id.
 *
 * Throwaway. See gallery.js.
 */




* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #17171a;
  color: #e7e7ea;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ----------------------------------------------------------------- chrome */

.chrome {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #17171a;
  border-bottom: 1px solid #303036;
}

.chrome-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 0.85rem;
  border-bottom: 1px solid #26262b;
}

.chrome-brand {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  white-space: nowrap;
}

.chrome-brand-dim { color: #75757e; font-weight: 400; letter-spacing: 0.06em; }

.chrome-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
}

.chrome-tab {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  flex: 0 0 auto;
  padding: 0.32rem 0.6rem;
  font: inherit;
  font-size: 0.73rem;
  color: #b6b6bd;
  background: #1f1f24;
  border: 1px solid #303036;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}

.chrome-tab:hover { color: #fff; border-color: #4a4a54; }

.chrome-tab.is-on {
  color: #17171a;
  background: #e7e7ea;
  border-color: #e7e7ea;
  font-weight: 600;
}

.tab-group {
  font-size: 0.6rem;
  opacity: 0.55;
  border: 1px solid currentColor;
  border-radius: 3px;
  padding: 0 0.25em;
}

.chrome-caption {
  display: flex;
  align-items: flex-start;
  gap: 1.5rem;

/* --------------------------------------------------- the CRT texture layer
 * One implementation, four strengths, switched from the caption bar. This is
 * the open question the first phase has to answer: how far the texture
 * reaches, and what it costs on a board you have to read.
 */

.variant .crt {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

/* A real scanline is the gap between lines, not the line — on a dark page a
 * white stripe does nothing, because there is nothing to lighten. Drawing the
 * dark gap instead modulates the bright text and the glow, which is where the
 * effect is actually visible. That is the difference between this and the
 * mockup's white-on-overlay version, which reads as nothing at all here. */
.variant[data-crt="off"] .crt { display: none; }

.variant[data-crt="soft"] .crt {
  background: repeating-linear-gradient(to bottom,
    rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
}

.variant[data-crt="mock"] .crt {
  background: repeating-linear-gradient(to bottom,
    rgba(0, 0, 0, 0.34) 0 1px, transparent 1px 3px);
}

.variant[data-crt="heavy"] .crt {
  background:
    repeating-linear-gradient(to bottom,
      rgba(0, 0, 0, 0.55) 0 1.5px, transparent 1.5px 3.5px),
    radial-gradient(120% 100% at 50% 50%,
      transparent 52%, rgba(0, 0, 0, 0.5) 100%);
}

.variant[data-crt="heavy"] .crt::after {
  content: "";
  position: absolute;
  inset: -30% 0;
  background: linear-gradient(to bottom,
    transparent, rgba(255, 255, 255, 0.045) 45%, rgba(255, 255, 255, 0.06) 50%, transparent);
  animation: glare 7s linear infinite;
}

@keyframes glare {
  from { transform: translateY(-40%); }
  to { transform: translateY(140%); }
}

@media (prefers-reduced-motion: reduce) {
  .variant[data-crt="heavy"] .crt::after { animation: none; opacity: 0.35; }
}

/* --------------------------------------------------------- shared defaults
 * Sensible fallbacks so a half-written variant still renders something rather
 * than a pile of unstyled spans. Every variant overrides these.
 */

.variant .screen { padding: 2rem 1.5rem 3rem; }
.variant .top { display: flex; justify-content: space-between; align-items: baseline; }
.variant .nav { display: flex; gap: 1rem; }
.variant .nav a { text-decoration: none; color: inherit; }
.variant .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
.variant .tile { display: flex; flex-direction: column; gap: 0.4rem; text-decoration: none; color: inherit; }
.variant .tnum { display: none; }
.variant .sample-row { display: flex; flex-wrap: wrap; gap: 1.25rem; }
.variant .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); }
.variant .mgrid { display: flex; }
.variant .scell, .variant .mcell { display: grid; place-items: center; }
.variant .pbar { display: flex; align-items: center; gap: 0.5rem; }
.variant .pcourt { position: relative; }
.variant .ppad { position: absolute; }
.variant .ppad.l { left: 0; }
.variant .ppad.r { right: 0; }
.variant .pball { position: absolute; }


/* ===== variants/cold.css ===== */
/* 01 — Cold Terminal
 *
 * The agreed mockup, tightened. One phosphor green on near-black, hairline
 * rules, everything upper case, nothing rounded. The description leaves the
 * tile and lives in the info panel, which is what buys the grid its density.
 */

#v-cold {
  --bg: #040604;
  --panel: #070c07;
  --green: #33ff66;
  --dim: #1f9e46;
  --dimmer: #14612d;
  --line: #143a20;

  --amber: #ffb000;
  --cyan: #3fd4ff;
  --magenta: #ff4dd8;
  --red: #ff3b3b;

  background: var(--bg);
  color: var(--green);
  font-family: 'VT323', ui-monospace, monospace;
  font-size: 19px;
  line-height: 1.25;
}

#v-cold .deco {
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(51, 255, 102, 0.055), transparent 70%),
    radial-gradient(120% 100% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.6));
}

#v-cold .screen {
  max-width: 940px;
  margin: 0 auto;
  padding: 1.6rem 1.4rem 3rem;
}

/* ------------------------------------------------------------------- top */

#v-cold .top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--line);
}

#v-cold .brand {
  font-size: 2.1rem;
  letter-spacing: 0.06em;
  text-shadow: 0 0 6px rgba(51, 255, 102, 0.5), 0 0 18px rgba(51, 255, 102, 0.18);
}

#v-cold .nav { display: flex; gap: 1.1rem; }

#v-cold .nav a {
  color: var(--dim);
  letter-spacing: 0.12em;
  font-size: 0.95rem;
  text-decoration: none;
  transition: color 0.12s ease, text-shadow 0.12s ease;
}

#v-cold .nav a:hover,
#v-cold .nav a.active { color: var(--green); text-shadow: 0 0 6px rgba(51, 255, 102, 0.45); }

#v-cold .strap {
  margin: 0.55rem 0 1.35rem;
  color: var(--dim);
  letter-spacing: 0.1em;
  font-size: 0.92rem;
}

#v-cold .strap::after {
  content: "";
  display: inline-block;
  width: 0.52em;
  height: 1em;
  margin-left: 0.35em;
  background: var(--green);
  vertical-align: -0.14em;
  animation: cold-blink 1.06s steps(1) infinite;
}

@keyframes cold-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #v-cold .strap::after { animation: none; } }

/* ------------------------------------------------------------------ grid */

#v-cold .grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

#v-cold .tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1.15rem 0.5rem 0.85rem;

  color: var(--dim);
  text-decoration: none;

#v-cold .tico { display: block; }

/* ------------------------------------------------------------ info panel */

#v-cold .info {

    "label meta"
    "label desc"

@keyframes cold-launch { 50% { background: var(--dim); } }

/* ---------------------------------------------------------- game samples */

#v-cold .sample { margin-top: 2.2rem; }

#v-cold .sample-h {
  margin: 0 0 0.7rem;
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.18em;

#v-cold .sample-row { display: flex; flex-wrap: wrap; gap: 1rem; }

#v-cold .sbox {

  padding: 0.7rem 0.85rem 0.85rem;

  background: var(--panel);
}

#v-cold .sbox-h {

  margin-bottom: 0.55rem;

  letter-spacing: 0.14em;

#v-cold .sgrid {

#v-cold .scell {

 * phosphor. A brightness ramp alone cannot carry eight steps, so this borrows
 * the other real monitor phosphors rather than inventing web colours. */
#v-cold .n1 { color: var(--cyan); }

#v-cold .ppad.r { right: 6px; top: 16px; background: var(--red); }

/* ===== variants/amber.css ===== */
/* 02 — Amber Monitor
 *
 * The same CRT idea as Cold Terminal on a P3 amber tube instead of P1 green,
 * and deliberately the calm one. Three moves separate it from the reference:
 * the ground is brown-black rather than blue-black, so the warmth is in the
 * glass and not only in the text; the CRT quality comes from bloom — wide,
 * low-opacity phosphor bleed — rather than from scanlines; and the grid is
 * three by two with the description in the tile, so the page breathes.
 *
 * Everything is VT323. Copy is sentence case rather than the reference's
 * relentless upper case; the wordmark is the one exception, because a
 * wordmark is a mark, not a sentence.
 */

#v-amber {
  /* The ground. Brown-black: red channel highest, blue channel almost gone.
   * #0a0704 next to cold.css's #040604 is the whole point — an amber tube's
   * dark is warm, and recolouring green text over a blue-black ground looks
   * like a filter rather than a different monitor. */
  --bg: #0a0704;
  --panel: #150f07;
  --panel-lit: #221709;   /* a tile under the cursor */

  /* The phosphor ramp, brightest first. Six steps, one hue. */
  --hot: #fff2da;         /* white-hot — the beam driven past amber */
  --pale: #ffd694;
  --amber: #ffb000;       /* the primary */
  --soft: #f2bc62;        /* secondary text. Lifted from #e8ae4e after looking:
                           * amber body copy an octave down from the primary
                           * reads as brown, not as a dimmer amber */
  --dim: #b8790a;         /* tertiary text and strong rules — the floor for words */
  --deep: #7a5008;        /* rules on a panel. Never a word: ~2.9:1 */
  --line: #3d2807;        /* hairlines. Never a word */

  /* Bloom. Stacked shadows, each wider and fainter than the last, none of them
   * tight: a 1–2px shadow reads as a drop shadow and kills the illusion. The
   * outermost is 96px at 0.10 — barely visible alone, and the reason the text
   * looks like it is emitting rather than painted. Bloom is reserved for hot
   * text; on 22px body copy it turns to mud. */
  --bloom: 0 0 8px rgba(255, 176, 0, 0.30), 0 0 26px rgba(255, 176, 0, 0.16);
  --bloom-lg:
    0 0 6px rgba(255, 176, 0, 0.42),
    0 0 22px rgba(255, 176, 0, 0.34),
    0 0 46px rgba(255, 176, 0, 0.20),
    0 0 96px rgba(255, 176, 0, 0.10);

  /* The mine icon punches its highlight with this; the ground is dark, so the
   * default near-black is nearly right, but warm it to match. */
  --icon-hole: #0a0704;

  background: var(--bg);
  color: var(--soft);
  font-family: 'VT323', ui-monospace, monospace;
  font-size: 22px;        /* three steps up from the reference's 19px */
  line-height: 1.35;
}

/* True sentence case out of upper-case DOM strings. `capitalize` cannot do
 * this — it only touches first letters and leaves the rest shouting. */
#v-amber .ilabel,
#v-amber .imeta,
#v-amber .icta,
#v-amber .nav a,
#v-amber .sample-h,
#v-amber .sbox-h { text-transform: lowercase; }

#v-amber .ilabel::first-letter,
#v-amber .imeta::first-letter,
#v-amber .icta::first-letter,
#v-amber .nav a::first-letter,
#v-amber .sample-h::first-letter,
#v-amber .sbox-h::first-letter { text-transform: uppercase; }

/* ------------------------------------------------------------------ deco */

/* A warm wash where the beam is strongest, and a vignette for the curve of
 * the glass. The wash is amber at 0.075 — any stronger and the ground stops
 * being black and starts being brown. */
#v-amber .deco {
  background:
    radial-gradient(78% 58% at 50% 2%, rgba(255, 176, 0, 0.075), transparent 72%),
    radial-gradient(60% 45% at 50% 100%, rgba(255, 140, 0, 0.035), transparent 70%),
    radial-gradient(125% 105% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.72));
}

#v-amber .screen {
  max-width: 1080px;
  margin: 0 auto;
  padding: 2.6rem 1.8rem 3.6rem;
}

/* ------------------------------------------------------------------- top */

#v-amber .top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  flex-wrap: wrap;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--line);
}

/* The one thing left in caps. Amber at 3rem with the full bloom is where this
 * palette is worth having, so the wordmark gets the largest type on the page
 * and the widest glow. */
#v-amber .brand {
  font-size: 3.1rem;
  line-height: 1;
  letter-spacing: 0.1em;
  color: var(--hot);
  text-shadow: var(--bloom-lg);
}

#v-amber .nav { display: flex; gap: 1.6rem; }

#v-amber .nav a {
  display: inline-block;       /* so ::first-letter applies */
  color: var(--dim);
  font-size: 1.15rem;
  letter-spacing: 0.06em;
  text-decoration: none;
  padding-bottom: 0.15rem;
  border-bottom: 1px solid transparent;
  transition: color 0.16s ease, border-color 0.16s ease;
}

#v-amber .nav a:hover,
#v-amber .nav a:focus-visible { color: var(--pale); outline: none; }

/* Active is marked by a rule as well as by colour — the selected and hover
 * states on this page never lean on hue alone, and there is no second hue to
 * lean on anyway. */
#v-amber .nav a.active {
  color: var(--amber);
  border-bottom-color: var(--amber);
  text-shadow: var(--bloom);
}

#v-amber .strap {
  margin: 1.1rem 0 2rem;
  font-size: 1.45rem;
  letter-spacing: 0.02em;
  color: var(--pale);     /* the greeting, so it is the second-brightest line */
}

/* A slow, wide cursor. The reference blinks at ~1s in hard steps; this one
 * fades, because the whole variant is the calm reading of the same idea. */
#v-amber .strap::after {
  content: "";
  display: inline-block;
  width: 0.5em;
  height: 0.95em;
  margin-left: 0.45em;
  background: var(--amber);
  box-shadow: 0 0 12px rgba(255, 176, 0, 0.55);
  vertical-align: -0.1em;
  animation: amber-pulse 2.4s ease-in-out infinite;
}

@keyframes amber-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }

@media (prefers-reduced-motion: reduce) {
  #v-amber .strap::after { animation: none; opacity: 0.75; }
}

/* ------------------------------------------------------------------ grid */

/* Three by two, not six across. The reference's density is its argument;
 * roominess is this one's, and at 1080px three columns of ~330px leave enough
 * width to carry the description in the tile. auto-fit rather than a fixed
 * `repeat(3, …)` so it falls to two columns and then one on the way down to a
 * phone without a breakpoint per step. */
#v-amber .grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(285px, 1fr));
  gap: 1.1rem;
}

/* The description lives in the tile here, where the reference hides it in the
 * info panel. Two reasons: with six tiles at this size there is room, and it
 * stops the info panel being the only place the page explains itself — which
 * matters on a touch screen, where nothing hovers and the panel only fills in
 * after a tap. The cost is that the panel now largely repeats the tile. */
#v-amber .tile {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas:
    "ico name"
    "ico desc"
    "ico cat";
  /* The third row takes the slack, so the category tag sits on the floor of
   * the tile. Grid rows are equal height across a row, and a one-line
   * description next to a two-line one otherwise leaves the tag floating at a
   * different height in every tile. */
  grid-template-rows: auto auto 1fr;
  column-gap: 1.05rem;
  padding: 1.4rem 1.3rem 1.25rem;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--soft);
  text-decoration: none;
  transition: background 0.16s ease, border-color 0.16s ease,
              box-shadow 0.16s ease, transform 0.16s ease;
}

/* The selection bar: a solid amber edge that grows from nothing. A shape
 * change, so hover and selection survive being read in greyscale. */
#v-amber .tile::before {
  content: "";
  position: absolute;
  left: -1px;
  top: -1px;
  bottom: -1px;
  width: 4px;
  background: var(--amber);
  box-shadow: 0 0 14px rgba(255, 176, 0, 0.6);
  transform: scaleY(0);
  transform-origin: 50% 50%;
  transition: transform 0.18s ease;
}

#v-amber .tico {
  grid-area: ico;
  align-self: start;
  color: var(--dim);
  transition: color 0.16s ease, filter 0.16s ease;
}

#v-amber .ico { width: 46px; height: 46px; }

#v-amber .tname {
  grid-area: name;
  font-size: 1.75rem;
  line-height: 1.05;
  letter-spacing: 0.01em;
  color: var(--pale);
  transition: color 0.16s ease, text-shadow 0.16s ease;
}

#v-amber .tdesc {
  grid-area: desc;
  display: block;
  margin-top: 0.35rem;
  font-size: 1.08rem;
  line-height: 1.28;
  color: #d8a45a;         /* one step under --soft. An opacity here instead
                           * greys the amber toward the brown ground */
}

/* Lower case, not sentence case: this is a tag, not a phrase. */
#v-amber .tcat {
  grid-area: cat;
  align-self: end;
  margin-top: 0.7rem;
  font-size: 0.92rem;
  letter-spacing: 0.22em;
  text-transform: lowercase;
  color: var(--dim);
}

#v-amber .tnum {
  display: block;
  position: absolute;
  top: 0.7rem;
  right: 0.9rem;
  font-size: 1.15rem;
  letter-spacing: 0.05em;
  color: var(--dim);      /* the floor for anything that is a word or a number */
}

#v-amber .tile:hover,
#v-amber .tile:focus-visible,
#v-amber .tile.is-selected {
  background: var(--panel-lit);
  border-color: var(--dim);
  outline: none;
  box-shadow: 0 0 34px rgba(255, 176, 0, 0.12);
  transform: translateY(-2px);
}

#v-amber .tile:hover::before,
#v-amber .tile:focus-visible::before,
#v-amber .tile.is-selected::before { transform: scaleY(1); }

#v-amber .tile:hover .tname,
#v-amber .tile:focus-visible .tname,
#v-amber .tile.is-selected .tname {
  color: var(--hot);
  text-shadow: var(--bloom);
}

#v-amber .tile:hover .tico,
#v-amber .tile:focus-visible .tico,
#v-amber .tile.is-selected .tico {
  color: var(--amber);
  filter: drop-shadow(0 0 10px rgba(255, 176, 0, 0.5));
}

#v-amber .tile:hover .tnum,
#v-amber .tile:focus-visible .tnum,
#v-amber .tile.is-selected .tnum { color: var(--amber); }

@media (prefers-reduced-motion: reduce) {
  #v-amber .tile,
  #v-amber .tile::before { transition: none; }
  #v-amber .tile:hover,
  #v-amber .tile:focus-visible,
  #v-amber .tile.is-selected { transform: none; }
}

/* ------------------------------------------------------------ info panel */

/* Three columns rather than the reference's two, with the key pushed to the
 * far right. At 1080px a two-column info panel leaves half the width empty
 * and the block reads as an accident; sending the call to action to the
 * opposite edge makes the whitespace deliberate and gives the eye somewhere
 * to land after the name. */
#v-amber .info {
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas:
    "label name cta"
    "label meta cta"
    "label desc cta";
  column-gap: 1.6rem;
  align-items: start;
  margin-top: 2.2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--line);
}

#v-amber .ilabel {
  grid-area: label;
  align-self: start;
  padding-top: 0.7rem;
  font-size: 0.95rem;
  letter-spacing: 0.2em;
  color: var(--dim);
}

#v-amber .inm {
  grid-area: name;
  font-size: 2.6rem;
  line-height: 1.1;
  letter-spacing: 0.02em;
  color: var(--hot);
  text-shadow: var(--bloom-lg);
}

#v-amber .imeta {
  grid-area: meta;
  margin-top: 0.15rem;
  font-size: 1.05rem;
  letter-spacing: 0.14em;
  color: var(--dim);
}

#v-amber .idesc {
  grid-area: desc;
  margin-top: 0.35rem;
  font-size: 1.25rem;
  color: var(--soft);
}

/* An outlined key rather than a filled block. The reference fills its CTA
 * solid green and inverts the text; solid amber at this size is a lamp, and
 * this variant is the quiet one. */
#v-amber .icta {
  grid-area: cta;
  justify-self: end;
  align-self: center;
  padding: 0.4rem 1.4rem 0.34rem;
  font-size: 1.25rem;
  letter-spacing: 0.12em;
  color: var(--amber);
  border: 1px solid var(--amber);
  box-shadow: 0 0 20px rgba(255, 176, 0, 0.18), inset 0 0 18px rgba(255, 176, 0, 0.08);
  text-shadow: var(--bloom);
}

/* The launch flash: the key fills, the way a monitor overdrives when the beam
 * is held on one spot. Slow enough to read as a glow, not a strobe. */
#v-amber .info.is-launching .icta { animation: amber-launch 0.35s ease-out 2; }

@keyframes amber-launch {
  0%, 100% { background: transparent; color: var(--amber); }
  40% { background: var(--amber); color: var(--bg); text-shadow: none; }
}

@media (prefers-reduced-motion: reduce) {
  #v-amber .info.is-launching .icta { animation: none; background: rgba(255, 176, 0, 0.2); }
}

/* ---------------------------------------------------------- game samples */

/* The same hairline as the header and the info panel. Without it the air
 * between the call to action and the boards reads as a hole in the page
 * rather than as a section break — the one place where "give it room" and
 * "look deliberate" pull against each other. */
#v-amber .sample {
  margin-top: 2.6rem;
  padding-top: 1.4rem;
  border-top: 1px solid var(--line);
}

#v-amber .sample-h {
  margin: 0 0 1rem;
  font-size: 1.05rem;
  font-weight: 400;
  letter-spacing: 0.16em;
  color: var(--dim);
}

/* flex-start, not the default stretch: the Minesweeper box is twice the width
 * of the other two and was being stretched to their height, leaving a hand's
 * width of empty panel under the digits. */
#v-amber .sample-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.4rem; }

#v-amber .sbox {
  flex: 0 0 auto;
  padding: 1rem 1.1rem 1.15rem;
  background: var(--panel);
  border: 1px solid var(--line);
}

#v-amber .sbox-h {
  display: block;
  margin-bottom: 0.75rem;
  font-size: 0.95rem;
  letter-spacing: 0.16em;
  color: var(--dim);
}

/* --- Sudoku.
 * One hue means given and entered cannot be told apart by colour, so they are
 * told apart by *state of the phosphor*: a given is warm and settled, an
 * entered digit is white-hot and blooming, the way freshly written text on a
 * long-persistence tube is brighter than what has been sitting there. That is
 * a real property of the display being imitated rather than a workaround. */
#v-amber .sgrid {
  display: grid;
  grid-template-columns: repeat(3, 40px);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--deep);
}

#v-amber .scell {
  height: 40px;
  display: grid;
  place-items: center;
  background: #100b06;
  font-size: 1.5rem;
  color: var(--dim);
}

#v-amber .scell.given { color: var(--soft); }

#v-amber .scell.entered {
  color: var(--hot);
  text-shadow: var(--bloom);
}

#v-amber .scell.sel {
  background: #2a1c09;
  box-shadow: inset 0 0 0 2px var(--amber);
}

/* --- Minesweeper 1–8. The hard case, and the honest one.
 *
 * There is no second hue to spend, so the eight are separated on three axes
 * that a single-phosphor monitor actually has:
 *
 *   luminance   white-hot → pale → amber → dim → deep ochre
 *   saturation  saturated amber vs. desaturated tan at the same luminance
 *   bloom       lit (glowing) vs. flat
 *
 * That yields six steps I am willing to defend at 40px. Seven and eight get
 * the two brightest colours *again*, plus an underline. This is deliberate:
 * 7 and 8 are vanishingly rare in real play, so they are the two that can
 * afford to cost the player half a second of decoding, and 1–3 — the numbers
 * you actually read at speed — keep the three cleanest, brightest steps.
 *
 * Rejected: drifting the hue toward orange (#ff8a3a) for n4. It works, and it
 * is cheating — it answers a different question than the one this variant is
 * here to answer. */
#v-amber .mgrid {
  display: flex;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--deep);
}

#v-amber .mcell {
  position: relative;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: #16100a;
  font-size: 1.5rem;
}

/* Read as a 3x2 table: three luminance bands, each in a saturated amber and a
 * near-neutral bone. The neutral column is what makes this work — next to a
 * saturated amber, a warm grey at the same brightness reads as a different
 * *colour*, not as a dimmer one, and that is the only extra dimension a
 * single-phosphor tube has to give.
 *
 * The first pass put the bottom band at #b8790a / #8f7a5c and both vanished
 * into the cell at 33px; VT323's strokes are one pixel wide at this size and
 * carry far less colour than a solid glyph would. The floor moved up two
 * steps to #c98511 / #a89a8a — around 5:1 on the cell — and it is legible
 * now. That is the finding: on a dark ground the usable bottom of an amber
 * ramp is much higher than the contrast maths alone suggests. */
#v-amber .n1 { color: #ffb000; text-shadow: 0 0 10px rgba(255, 176, 0, 0.5); }   /* amber, lit — the number you read most */
#v-amber .n2 { color: #fff2da; text-shadow: 0 0 10px rgba(255, 226, 176, 0.45); }/* white-hot, lit */
#v-amber .n3 { color: #ffd24d; }                                                 /* gold — high band, saturated, flat */
#v-amber .n4 { color: #d3c0a2; }                                                 /* bone — high band, neutral. Dropped from
                                                                                  * #ddd0bb: against the lit #fff2da of n2 it
                                                                                  * needed the extra step to stop reading as
                                                                                  * "the same white, further away" */
#v-amber .n5 { color: #c98511; }                                                 /* ochre — low band, saturated */
#v-amber .n6 { color: #a89a8a; }                                                 /* smoke — low band, neutral */
#v-amber .n7 { color: #ffb000; }                                                 /* = n1, marked */
#v-amber .n8 { color: #fff2da; }                                                 /* = n2, marked */

/* The mark. A lit baseline under the glyph, in its own colour, so it reads as
 * part of the digit rather than as a border on the cell. */
#v-amber .n7::after,
#v-amber .n8::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 8px;
  width: 16px;
  height: 2px;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}

/* No red available for the flag, so the flag is the brightest thing on the
 * board and sits in a lit well of its own. Brightness is the only alarm
 * channel a monochrome monitor has. */
#v-amber .mcell.flag {
  color: var(--hot);
  text-shadow: 0 0 12px rgba(255, 176, 0, 0.7);
  background: #2a1c09;
  box-shadow: inset 0 0 0 1px var(--deep);
}

#v-amber .mcell.hidden-cell {
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line), inset 1px 1px 0 rgba(255, 176, 0, 0.07);
}

/* --- Pong. */
#v-amber .pbar {
  display: flex;
  align-items: baseline;
  gap: 0.7rem;
  font-size: 1.6rem;
  letter-spacing: 0.08em;
}

#v-amber .pscore {
  color: var(--hot);
  text-shadow: var(--bloom);
  font-variant-numeric: tabular-nums;
}

#v-amber .plabel {
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  color: var(--dim);
}

#v-amber .pdiv { flex: 0 0 32px; height: 1px; background: var(--deep); align-self: center; }

#v-amber .pcourt {
  position: relative;
  height: 58px;
  margin-top: 0.8rem;
  background: #0d0905;
  border: 1px solid var(--deep);
}

#v-amber .pcourt::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 4px;
  bottom: 4px;
  border-left: 1px dashed var(--deep);
}

/* Cold Terminal makes the opponent red. There is no red here, so the opponent
 * is simply the dimmer paddle — which is the single-hue answer to every
 * "them vs. you" problem on this site, and worth seeing early. */
#v-amber .ppad { position: absolute; top: 12px; width: 4px; height: 26px; }
#v-amber .ppad.l { left: 8px; background: var(--amber); box-shadow: 0 0 12px rgba(255, 176, 0, 0.6); }
#v-amber .ppad.r { right: 8px; top: 20px; background: var(--dim); }

#v-amber .pball {
  position: absolute;
  left: 60%;
  top: 24px;
  width: 6px;
  height: 6px;
  background: var(--hot);
  box-shadow: 0 0 14px rgba(255, 226, 170, 0.8);
}

/* ------------------------------------------------------------------ foot */

#v-amber .foot {
  margin-top: 3.2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: 1.02rem;
  letter-spacing: 0.06em;
  color: var(--dim);
}

/* -------------------------------------------------------------- narrower */

@media (max-width: 760px) {
  #v-amber { font-size: 20px; }
  #v-amber .screen { padding: 1.8rem 1.1rem 2.6rem; }
  #v-amber .brand { font-size: 2.4rem; }
  #v-amber .inm { font-size: 2.1rem; }
  #v-amber .info { grid-template-columns: 1fr; grid-template-areas: "label" "name" "meta" "desc" "cta"; }
  #v-amber .ilabel { padding-top: 0; margin-bottom: 0.3rem; }
  /* Once the panel is one column the key belongs on the left edge with
   * everything else; kept at justify-self:end it floats away from the text. */
  #v-amber .icta { justify-self: start; align-self: start; margin-top: 1.1rem; }
  #v-amber .sample-row { gap: 1rem; }
}


/* ===== variants/amberlit.css ===== */
/* 03 — Amber Arcade
 *
 * Amber Monitor with a colour screen. Gabriel picked Amber and then asked for
 * the thing Amber was explicitly recorded as unable to do: the hue budget that
 * Cold Terminal and Vector Neon spend on the boards. This is that variant.
 *
 * Everything about the shell is Amber Monitor unchanged — the brown-black
 * ground, the bloom instead of scanlines, VT323 at 22px, sentence case, the
 * three-by-two grid with the description in the tile, the roominess. Diff this
 * against amber.css and the only things that moved are colours, and only
 * inside the parts of the page that represent a game.
 *
 * THE FICTION HAS TO CHANGE, and it is worth saying out loud rather than
 * discovering later. A P3 amber tube is monochrome by physics; it cannot show
 * a magenta paddle. So this is no longer "the site is an amber monitor" — it
 * is "the site is an amber-panelled machine with a colour display in it". The
 * chrome is the cabinet: wordmark, nav, strap, rules, footer, all still one
 * hue. The boards are the screen. That line is the whole design, and every
 * value below sits on one side of it.
 *
 * Two rules keep the colour from turning this into Cold Terminal in a warm
 * coat:
 *
 *   1. AMBER STAYS THE HOME HUE. It is the wordmark, the cursor, the selected
 *      state, and n1 — the Minesweeper digit you read most. The other hues are
 *      guests. Nothing that is chrome takes one.
 *   2. EVERY GUEST HUE IS WARMED AND LIGHTENED off the cold variants' values.
 *      #3fd4ff dropped straight onto #0a0704 reads as a colour that wandered in
 *      from another page — the ground is brown-black and a 100%-blue cyan has
 *      nothing in common with it. Each one below records what it moved from.
 */

#v-amberlit {
  /* The ground. Brown-black: red channel highest, blue channel almost gone.
   * #0a0704 next to cold.css's #040604 is the whole point — an amber tube's
   * dark is warm, and recolouring green text over a blue-black ground looks
   * like a filter rather than a different monitor. */
  --bg: #0a0704;
  --panel: #150f07;
  --panel-lit: #221709;   /* a tile under the cursor */

  /* The phosphor ramp, brightest first. Six steps, one hue. */
  --hot: #fff2da;         /* white-hot — the beam driven past amber */
  --pale: #ffd694;
  --amber: #ffb000;       /* the primary */
  --soft: #f2bc62;        /* secondary text. Lifted from #e8ae4e after looking:
                           * amber body copy an octave down from the primary
                           * reads as brown, not as a dimmer amber */
  --dim: #b8790a;         /* tertiary text and strong rules — the floor for words */
  --deep: #7a5008;        /* rules on a panel. Never a word: ~2.9:1 */
  --line: #3d2807;        /* hairlines. Never a word */

  /* ---- The guests. Six hues that amber does not have, for the screen only.
   *
   * Chosen for hue distance from amber (41°) first and from each other second,
   * then dragged warm and light until each one looked like it belonged on a
   * brown-black ground. The parenthesised value is what it started as in
   * cold.css or vector.css, and every one of them moved:
   *
   *   cyan     192°  the coldest thing here, and the one that had to move most
   *   jade     157°
   *   lime      75°  the closest to amber, so it is kept bright and is never
   *                  set next to amber at the same size
   *   coral      6°  danger, and Pong's opponent
   *   rose     328°  Pong's player, per the redesign's own plan for that game
   *   violet   258°
   *
   * The two neutrals at the end are Amber Monitor's own — bone and smoke — and
   * they are the reason this set does not need an eighth hue. */
  --cyan:   #6fdcf2;      /* from #3fd4ff: +12 red, +8 green. Pure cyan on this
                           * ground reads as a hole punched to another site */
  --jade:   #5fd9a0;      /* from #33ff66. Green is amber's worst neighbour —
                           * at full phosphor they fight, and this is the level
                           * where jade sits beside amber without arguing */
  --lime:   #d4e85c;      /* the risky one, 34° off amber. Survives only because
                           * it is much lighter and much less saturated */
  --coral:  #ff6a56;      /* from #ff5a4d, warmed toward the ground */
  --rose:   #ff7fcb;      /* from #ff4dd8. The mockup's magenta is a cold pink;
                           * this is the same idea lit by a warm lamp */
  --violet: #b9a2ff;      /* from #c79dff, held light — violet is the first hue
                           * to disappear into a dark warm ground */

  /* Category accents. One per category, drawn from the guests, so the hub's
   * three groups are told apart by hue and the boards reuse the same six
   * rather than starting a second colour system. Amber is deliberately NOT
   * one of them: it is the selected/active colour everywhere on this page, and
   * a category that owned it would make "selected" ambiguous. */
  --cat-arcade:   var(--rose);
  --cat-puzzle:   var(--cyan);
  --cat-strategy: var(--jade);

  /* Bloom. Stacked shadows, each wider and fainter than the last, none of them
   * tight: a 1–2px shadow reads as a drop shadow and kills the illusion. The
   * outermost is 96px at 0.10 — barely visible alone, and the reason the text
   * looks like it is emitting rather than painted. Bloom is reserved for hot
   * text; on 22px body copy it turns to mud. */
  --bloom: 0 0 8px rgba(255, 176, 0, 0.30), 0 0 26px rgba(255, 176, 0, 0.16);
  --bloom-lg:
    0 0 6px rgba(255, 176, 0, 0.42),
    0 0 22px rgba(255, 176, 0, 0.34),
    0 0 46px rgba(255, 176, 0, 0.20),
    0 0 96px rgba(255, 176, 0, 0.10);

  /* The mine icon punches its highlight with this; the ground is dark, so the
   * default near-black is nearly right, but warm it to match. */
  --icon-hole: #0a0704;

  background: var(--bg);
  color: var(--soft);
  font-family: 'VT323', ui-monospace, monospace;
  font-size: 22px;        /* three steps up from the reference's 19px */
  line-height: 1.35;
}

/* True sentence case out of upper-case DOM strings. `capitalize` cannot do
 * this — it only touches first letters and leaves the rest shouting. */
#v-amberlit .ilabel,
#v-amberlit .imeta,
#v-amberlit .icta,
#v-amberlit .nav a,
#v-amberlit .sample-h,
#v-amberlit .sbox-h { text-transform: lowercase; }

#v-amberlit .ilabel::first-letter,
#v-amberlit .imeta::first-letter,
#v-amberlit .icta::first-letter,
#v-amberlit .nav a::first-letter,
#v-amberlit .sample-h::first-letter,
#v-amberlit .sbox-h::first-letter { text-transform: uppercase; }

/* ------------------------------------------------------------------ deco */

/* A warm wash where the beam is strongest, and a vignette for the curve of
 * the glass. The wash is amber at 0.075 — any stronger and the ground stops
 * being black and starts being brown. */
#v-amberlit .deco {
  background:
    radial-gradient(78% 58% at 50% 2%, rgba(255, 176, 0, 0.075), transparent 72%),
    radial-gradient(60% 45% at 50% 100%, rgba(255, 140, 0, 0.035), transparent 70%),
    radial-gradient(125% 105% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.72));
}

#v-amberlit .screen {
  max-width: 1080px;
  margin: 0 auto;
  padding: 2.6rem 1.8rem 3.6rem;
}

/* ------------------------------------------------------------------- top */

#v-amberlit .top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  flex-wrap: wrap;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--line);
}

/* The one thing left in caps. Amber at 3rem with the full bloom is where this
 * palette is worth having, so the wordmark gets the largest type on the page
 * and the widest glow. */
#v-amberlit .brand {
  font-size: 3.1rem;
  line-height: 1;
  letter-spacing: 0.1em;
  color: var(--hot);
  text-shadow: var(--bloom-lg);
}

#v-amberlit .nav { display: flex; gap: 1.6rem; }

#v-amberlit .nav a {
  display: inline-block;       /* so ::first-letter applies */
  color: var(--dim);
  font-size: 1.15rem;
  letter-spacing: 0.06em;
  text-decoration: none;
  padding-bottom: 0.15rem;
  border-bottom: 1px solid transparent;
  transition: color 0.16s ease, border-color 0.16s ease;
}

#v-amberlit .nav a:hover,
#v-amberlit .nav a:focus-visible { color: var(--pale); outline: none; }

/* Active is marked by a rule as well as by colour — the selected and hover
 * states on this page never lean on hue alone, and there is no second hue to
 * lean on anyway. */
#v-amberlit .nav a.active {
  color: var(--amber);
  border-bottom-color: var(--amber);
  text-shadow: var(--bloom);
}

#v-amberlit .strap {
  margin: 1.1rem 0 2rem;
  font-size: 1.45rem;
  letter-spacing: 0.02em;
  color: var(--pale);     /* the greeting, so it is the second-brightest line */
}

/* A slow, wide cursor. The reference blinks at ~1s in hard steps; this one
 * fades, because the whole variant is the calm reading of the same idea. */
#v-amberlit .strap::after {
  content: "";
  display: inline-block;
  width: 0.5em;
  height: 0.95em;
  margin-left: 0.45em;
  background: var(--amber);
  box-shadow: 0 0 12px rgba(255, 176, 0, 0.55);
  vertical-align: -0.1em;
  animation: amberlit-pulse 2.4s ease-in-out infinite;
}

@keyframes amberlit-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }

@media (prefers-reduced-motion: reduce) {
  #v-amberlit .strap::after { animation: none; opacity: 0.75; }
}

/* ------------------------------------------------------------------ grid */

/* Three by two, not six across. The reference's density is its argument;
 * roominess is this one's, and at 1080px three columns of ~330px leave enough
 * width to carry the description in the tile. auto-fit rather than a fixed
 * `repeat(3, …)` so it falls to two columns and then one on the way down to a
 * phone without a breakpoint per step. */
#v-amberlit .grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(285px, 1fr));
  gap: 1.1rem;
}

/* The description lives in the tile here, where the reference hides it in the
 * info panel. Two reasons: with six tiles at this size there is room, and it
 * stops the info panel being the only place the page explains itself — which
 * matters on a touch screen, where nothing hovers and the panel only fills in
 * after a tap. The cost is that the panel now largely repeats the tile. */
#v-amberlit .tile {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas:
    "ico name"
    "ico desc"
    "ico cat";
  /* The third row takes the slack, so the category tag sits on the floor of
   * the tile. Grid rows are equal height across a row, and a one-line
   * description next to a two-line one otherwise leaves the tag floating at a
   * different height in every tile. */
  grid-template-rows: auto auto 1fr;
  column-gap: 1.05rem;
  padding: 1.4rem 1.3rem 1.25rem;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--soft);
  text-decoration: none;
  transition: background 0.16s ease, border-color 0.16s ease,
              box-shadow 0.16s ease, transform 0.16s ease;
}

/* The selection bar: a solid amber edge that grows from nothing. A shape
 * change, so hover and selection survive being read in greyscale. */
#v-amberlit .tile::before {
  content: "";
  position: absolute;
  left: -1px;
  top: -1px;
  bottom: -1px;
  width: 4px;
  background: var(--amber);
  box-shadow: 0 0 14px rgba(255, 176, 0, 0.6);
  transform: scaleY(0);
  transform-origin: 50% 50%;
  transition: transform 0.18s ease;
}

#v-amberlit .tico {
  grid-area: ico;
  align-self: start;
  color: var(--dim);
  transition: color 0.16s ease, filter 0.16s ease;
}

#v-amberlit .ico { width: 46px; height: 46px; }

#v-amberlit .tname {
  grid-area: name;
  font-size: 1.75rem;
  line-height: 1.05;
  letter-spacing: 0.01em;
  color: var(--pale);
  transition: color 0.16s ease, text-shadow 0.16s ease;
}

#v-amberlit .tdesc {
  grid-area: desc;
  display: block;
  margin-top: 0.35rem;
  font-size: 1.08rem;
  line-height: 1.28;
  color: #d8a45a;         /* one step under --soft. An opacity here instead
                           * greys the amber toward the brown ground */
}

/* Lower case, not sentence case: this is a tag, not a phrase. */
#v-amberlit .tcat {
  grid-area: cat;
  align-self: end;
  margin-top: 0.7rem;
  font-size: 0.92rem;
  letter-spacing: 0.22em;
  text-transform: lowercase;
  color: var(--dim);
}

#v-amberlit .tnum {
  display: block;
  position: absolute;
  top: 0.7rem;
  right: 0.9rem;
  font-size: 1.15rem;
  letter-spacing: 0.05em;
  color: var(--dim);      /* the floor for anything that is a word or a number */
}

#v-amberlit .tile:hover,
#v-amberlit .tile:focus-visible,
#v-amberlit .tile.is-selected {
  background: var(--panel-lit);
  border-color: var(--dim);
  outline: none;
  box-shadow: 0 0 34px rgba(255, 176, 0, 0.12);
  transform: translateY(-2px);
}

#v-amberlit .tile:hover::before,
#v-amberlit .tile:focus-visible::before,
#v-amberlit .tile.is-selected::before { transform: scaleY(1); }

#v-amberlit .tile:hover .tname,
#v-amberlit .tile:focus-visible .tname,
#v-amberlit .tile.is-selected .tname {
  color: var(--hot);
  text-shadow: var(--bloom);
}

#v-amberlit .tile:hover .tico,
#v-amberlit .tile:focus-visible .tico,
#v-amberlit .tile.is-selected .tico {
  color: var(--amber);
  filter: drop-shadow(0 0 10px rgba(255, 176, 0, 0.5));
}

#v-amberlit .tile:hover .tnum,
#v-amberlit .tile:focus-visible .tnum,
#v-amberlit .tile.is-selected .tnum { color: var(--amber); }

@media (prefers-reduced-motion: reduce) {
  #v-amberlit .tile,
  #v-amberlit .tile::before { transition: none; }
  #v-amberlit .tile:hover,
  #v-amberlit .tile:focus-visible,
  #v-amberlit .tile.is-selected { transform: none; }
}

/* --- Category colour on the hub.
 *
 * The smallest dose that is worth having. Each tile resolves one variable and
 * three things read it: the category tag at rest, and — only while the tile is
 * hovered or selected — the edge bar and the icon.
 *
 * Deliberately NOT coloured: the game's name, its description, its index
 * number, the tile's background and border. Amber Monitor's argument is that
 * it is the calm one, and six tiles each glowing in their own hue at rest is
 * the fastest way to throw that away. At rest the page is still amber with
 * three quiet tags on it; the colour arrives on the tile you are pointing at,
 * one at a time, which is also when it is telling you something.
 *
 * This is Vector Neon's discipline rather than Full Cabinet's — Cabinet gives
 * every tile a saturated category colour at rest and pays for it in noise. */
#v-amberlit .tile[data-cat="arcade"]   { --cat: var(--cat-arcade); }
#v-amberlit .tile[data-cat="puzzle"]   { --cat: var(--cat-puzzle); }
#v-amberlit .tile[data-cat="strategy"] { --cat: var(--cat-strategy); }

/* Held two steps under the guest hues at rest. A category tag is a label, not
 * an alarm, and at full strength six of them across the grid read as six
 * warnings. */
#v-amberlit .tcat { color: color-mix(in srgb, var(--cat) 62%, var(--panel)); }

#v-amberlit .tile:hover::before,
#v-amberlit .tile:focus-visible::before,
#v-amberlit .tile.is-selected::before {
  background: var(--cat);
  box-shadow: 0 0 14px color-mix(in srgb, var(--cat) 60%, transparent);
}

#v-amberlit .tile:hover .tcat,
#v-amberlit .tile:focus-visible .tcat,
#v-amberlit .tile.is-selected .tcat { color: var(--cat); }

#v-amberlit .tile:hover .tico,
#v-amberlit .tile:focus-visible .tico,
#v-amberlit .tile.is-selected .tico {
  color: var(--cat);
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--cat) 50%, transparent));
}

/* The tile's own wash stays amber. The category hue is on the edge, the icon
 * and the tag; letting it into the box shadow as well tints the whole tile and
 * the grid stops being one surface. */
#v-amberlit .tile:hover,
#v-amberlit .tile:focus-visible,
#v-amberlit .tile.is-selected { border-color: color-mix(in srgb, var(--cat) 40%, var(--line)); }

/* ------------------------------------------------------------ info panel */

/* Three columns rather than the reference's two, with the key pushed to the
 * far right. At 1080px a two-column info panel leaves half the width empty
 * and the block reads as an accident; sending the call to action to the
 * opposite edge makes the whitespace deliberate and gives the eye somewhere
 * to land after the name. */
#v-amberlit .info {
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas:
    "label name cta"
    "label meta cta"
    "label desc cta";
  column-gap: 1.6rem;
  align-items: start;
  margin-top: 2.2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--line);
}

#v-amberlit .ilabel {
  grid-area: label;
  align-self: start;
  padding-top: 0.7rem;
  font-size: 0.95rem;
  letter-spacing: 0.2em;
  color: var(--dim);
}

#v-amberlit .inm {
  grid-area: name;
  font-size: 2.6rem;
  line-height: 1.1;
  letter-spacing: 0.02em;
  color: var(--hot);
  text-shadow: var(--bloom-lg);
}

#v-amberlit .imeta {
  grid-area: meta;
  margin-top: 0.15rem;
  font-size: 1.05rem;
  letter-spacing: 0.14em;
  color: var(--dim);
}

#v-amberlit .idesc {
  grid-area: desc;
  margin-top: 0.35rem;
  font-size: 1.25rem;
  color: var(--soft);
}

/* An outlined key rather than a filled block. The reference fills its CTA
 * solid green and inverts the text; solid amber at this size is a lamp, and
 * this variant is the quiet one. */
#v-amberlit .icta {
  grid-area: cta;
  justify-self: end;
  align-self: center;
  padding: 0.4rem 1.4rem 0.34rem;
  font-size: 1.25rem;
  letter-spacing: 0.12em;
  color: var(--amber);
  border: 1px solid var(--amber);
  box-shadow: 0 0 20px rgba(255, 176, 0, 0.18), inset 0 0 18px rgba(255, 176, 0, 0.08);
  text-shadow: var(--bloom);
}

/* The launch flash: the key fills, the way a monitor overdrives when the beam
 * is held on one spot. Slow enough to read as a glow, not a strobe. */
#v-amberlit .info.is-launching .icta { animation: amberlit-launch 0.35s ease-out 2; }

@keyframes amberlit-launch {
  0%, 100% { background: transparent; color: var(--amber); }
  40% { background: var(--amber); color: var(--bg); text-shadow: none; }
}

@media (prefers-reduced-motion: reduce) {
  #v-amberlit .info.is-launching .icta { animation: none; background: rgba(255, 176, 0, 0.2); }
}

/* The panel is the one place a category hue is allowed to sit at full strength
 * and stay there, because exactly one game is selected at a time. It goes on
 * the meta line — the line that literally names the category — and nowhere
 * else. The name stays white-hot and the key stays amber: the key is the
 * action, and the action is the same colour on every game or it stops being
 * recognisable as the action. That is the same reason amber is not a category
 * colour. */
#v-amberlit .info[data-cat="arcade"]   { --cat: var(--cat-arcade); }
#v-amberlit .info[data-cat="puzzle"]   { --cat: var(--cat-puzzle); }
#v-amberlit .info[data-cat="strategy"] { --cat: var(--cat-strategy); }

#v-amberlit .imeta { color: var(--cat); }

/* ---------------------------------------------------------- game samples */

/* The same hairline as the header and the info panel. Without it the air
 * between the call to action and the boards reads as a hole in the page
 * rather than as a section break — the one place where "give it room" and
 * "look deliberate" pull against each other. */
#v-amberlit .sample {
  margin-top: 2.6rem;
  padding-top: 1.4rem;
  border-top: 1px solid var(--line);
}

#v-amberlit .sample-h {
  margin: 0 0 1rem;
  font-size: 1.05rem;
  font-weight: 400;
  letter-spacing: 0.16em;
  color: var(--dim);
}

/* flex-start, not the default stretch: the Minesweeper box is twice the width
 * of the other two and was being stretched to their height, leaving a hand's
 * width of empty panel under the digits. */
#v-amberlit .sample-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.4rem; }

#v-amberlit .sbox {
  flex: 0 0 auto;
  padding: 1rem 1.1rem 1.15rem;
  background: var(--panel);
  border: 1px solid var(--line);
}

#v-amberlit .sbox-h {
  display: block;
  margin-bottom: 0.75rem;
  font-size: 0.95rem;
  letter-spacing: 0.16em;
  color: var(--dim);
}

/* --- Sudoku.
 *
 * Amber Monitor separates a given from an entered digit by brightness alone,
 * because one hue is all it has. Here they get a hue, and the assignment is
 * the way round it is for a reason: the GIVEN stays amber and the ENTERED goes
 * cyan. The board is the machine's, your answers are yours, and the thing you
 * want to scan for at a glance is what you put there — including the one you
 * got wrong. Amber-for-yours would have buried your work in the ground colour
 * of the whole site.
 *
 * The selected cell keeps its amber ring, unchanged. Selection is amber
 * everywhere on this page and Sudoku is not the place to make it a special
 * case. */
#v-amberlit .sgrid {
  display: grid;
  grid-template-columns: repeat(3, 40px);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--deep);
}

#v-amberlit .scell {
  height: 40px;
  display: grid;
  place-items: center;
  background: #100b06;
  font-size: 1.5rem;
  color: var(--dim);
}

#v-amberlit .scell.given { color: var(--soft); }

/* Cyan, and lit in its own colour rather than in amber's bloom — a glow in the
 * wrong hue is how a colour screen ends up looking like a monochrome one with
 * a filter over it. */
#v-amberlit .scell.entered {
  color: var(--cyan);
  text-shadow: 0 0 9px rgba(111, 220, 242, 0.45), 0 0 22px rgba(111, 220, 242, 0.2);
}

#v-amberlit .scell.sel {
  background: #2a1c09;
  box-shadow: inset 0 0 0 2px var(--amber);
}

/* --- Minesweeper 1–8. The hard case, and the honest one.
 *
 * There is no second hue to spend, so the eight are separated on three axes
 * that a single-phosphor monitor actually has:
 *
 *   luminance   white-hot → pale → amber → dim → deep ochre
 *   saturation  saturated amber vs. desaturated tan at the same luminance
 *   bloom       lit (glowing) vs. flat
 *
 * That yields six steps I am willing to defend at 40px. Seven and eight get
 * the two brightest colours *again*, plus an underline. This is deliberate:
 * 7 and 8 are vanishingly rare in real play, so they are the two that can
 * afford to cost the player half a second of decoding, and 1–3 — the numbers
 * you actually read at speed — keep the three cleanest, brightest steps.
 *
 * Rejected: drifting the hue toward orange (#ff8a3a) for n4. It works, and it
 * is cheating — it answers a different question than the one this variant is
 * here to answer. */
#v-amberlit .mgrid {
  display: flex;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--deep);
}

#v-amberlit .mcell {
  position: relative;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: #16100a;
  font-size: 1.5rem;
}

/* Eight hues, and no marks at all — which is the single clearest thing colour
 * buys this design, and the reason to look at this box before any other part
 * of the page.
 *
 * Amber Monitor gets six defensible steps out of one hue and then has to spend
 * an underline on 7 and 8, because the site's own finding is that eight
 * distinguishable values do not exist inside one hue. With a hue budget the
 * problem simply stops existing: six guest hues plus amber plus one neutral,
 * each separated from its neighbours by at least 65° of hue, none of them
 * asked to be a "dimmer" version of anything.
 *
 * The ordering is not arbitrary. 1, 2 and 3 are what you actually read at
 * speed on a real board, so they take the three hues that are furthest apart
 * and most legible on this ground: amber, cyan, coral. 7 and 8 are almost
 * never seen and take the two that need the most decoding.
 *
 * Amber keeps n1. It is the site's home hue and the most common digit, and a
 * board where the number you see most is the colour the site already is looks
 * like it belongs here rather than like a palette dropped on top.
 *
 * The one real risk is n6 lime against n1 amber — 34° apart, the closest pair
 * in the set. They are separated on lightness instead, and the position helps:
 * lime is a rare digit and amber is a common one, so the pair is unlikely to
 * be adjacent on a board. If it fails when Minesweeper is actually built, lime
 * is the value to move, not amber.
 *
 * Kept from Amber Monitor: the finding that VT323's one-pixel strokes carry
 * far less colour than a solid glyph, so every value here is lighter than a
 * contrast check alone would demand. #b9a2ff for violet rather than a mid
 * violet is that rule being obeyed. */
#v-amberlit .n1 { color: #ffb000; text-shadow: 0 0 10px rgba(255, 176, 0, 0.45); }   /* amber   41° — the number you read most */
#v-amberlit .n2 { color: #6fdcf2; text-shadow: 0 0 10px rgba(111, 220, 242, 0.35); } /* cyan   192° */
#v-amberlit .n3 { color: #ff6a56; }                                                  /* coral    6° */
#v-amberlit .n4 { color: #5fd9a0; }                                                  /* jade   157° */
#v-amberlit .n5 { color: #ff7fcb; }                                                  /* rose   328° */
#v-amberlit .n6 { color: #d4e85c; }                                                  /* lime    75° */
#v-amberlit .n7 { color: #b9a2ff; }                                                  /* violet 258° */
#v-amberlit .n8 { color: #fff2da; }                                                  /* white-hot — no hue left, and none needed */

/* Amber Monitor has no red, so its flag has to be the brightest thing on the
 * board and sit in a lit well to be found at all. Here it is simply coral, and
 * the well goes away: a flag is a hazard and hazard is red on every board
 * anyone has ever played. That is the second thing colour buys, after the
 * eight numbers — an alarm channel that is not "brighter".
 *
 * Coral is the same hue as n3, which is fine and is not an accident worth
 * fixing: a flag is a glyph in a cell of its own and a 3 is a digit, and no
 * board has ever confused them. Spending a seventh hue here to avoid a
 * collision that cannot happen would cost the numbers a step. */
#v-amberlit .mcell.flag {
  color: var(--coral);
  text-shadow: 0 0 12px rgba(255, 106, 86, 0.55);
}

#v-amberlit .mcell.hidden-cell {
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line), inset 1px 1px 0 rgba(255, 176, 0, 0.07);
}

/* --- Pong. */
#v-amberlit .pbar {
  display: flex;
  align-items: baseline;
  gap: 0.7rem;
  font-size: 1.6rem;
  letter-spacing: 0.08em;
}

#v-amberlit .pscore {
  color: var(--hot);
  text-shadow: var(--bloom);
  font-variant-numeric: tabular-nums;
}

/* The scorebar picks up the paddles. Once the two sides have colours, a
 * scorebar that does not use them is throwing away the only thing that makes a
 * score readable at a glance mid-rally — which side is which. The digits carry
 * it and the labels take the same hue held down, so the pair reads as one
 * object rather than as two. */
#v-amberlit .pbar > :first-child { color: var(--rose); text-shadow: 0 0 10px rgba(255, 127, 203, 0.4); }
#v-amberlit .pbar > :last-child  { color: var(--coral); text-shadow: 0 0 10px rgba(255, 106, 86, 0.35); }

#v-amberlit .plabel {
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  color: var(--dim);
}

#v-amberlit .plabel:nth-child(2)  { color: color-mix(in srgb, var(--rose) 70%, var(--panel)); }
#v-amberlit .plabel:nth-child(4)  { color: color-mix(in srgb, var(--coral) 70%, var(--panel)); }

#v-amberlit .pdiv { flex: 0 0 32px; height: 1px; background: var(--deep); align-self: center; }

#v-amberlit .pcourt {
  position: relative;
  height: 58px;
  margin-top: 0.8rem;
  background: #0d0905;
  border: 1px solid var(--deep);
}

#v-amberlit .pcourt::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 4px;
  bottom: 4px;
  border-left: 1px dashed var(--deep);
}

/* The reason this variant exists.
 *
 * Amber Monitor's opponent is "the dimmer paddle", because a single-hue world
 * has no other answer to them-versus-you, and that was written up as the cost
 * of choosing it. Here it is rose against coral — the redesign's own plan for
 * Pong, which the plain amber direction could not have delivered.
 *
 * Rose for the player rather than amber, even though amber is the home hue.
 * Amber is what the chrome is made of, so an amber paddle reads as part of the
 * furniture; the player has to be the thing on the screen that is most clearly
 * NOT the machine. It is also the one place on the page where the hue means
 * "you" rather than naming a category, which is worth its own colour. */
#v-amberlit .ppad { position: absolute; top: 12px; width: 4px; height: 26px; }
#v-amberlit .ppad.l { left: 8px; background: var(--rose); box-shadow: 0 0 12px rgba(255, 127, 203, 0.65); }
#v-amberlit .ppad.r { right: 8px; top: 20px; background: var(--coral); box-shadow: 0 0 12px rgba(255, 106, 86, 0.5); }

#v-amberlit .pball {
  position: absolute;
  left: 60%;
  top: 24px;
  width: 6px;
  height: 6px;
  background: var(--hot);
  box-shadow: 0 0 14px rgba(255, 226, 170, 0.8);
}

/* ------------------------------------------------------------------ foot */

#v-amberlit .foot {
  margin-top: 3.2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  font-size: 1.02rem;
  letter-spacing: 0.06em;
  color: var(--dim);
}

/* -------------------------------------------------------------- narrower */

@media (max-width: 760px) {
  #v-amberlit { font-size: 20px; }
  #v-amberlit .screen { padding: 1.8rem 1.1rem 2.6rem; }
  #v-amberlit .brand { font-size: 2.4rem; }
  #v-amberlit .inm { font-size: 2.1rem; }
  #v-amberlit .info { grid-template-columns: 1fr; grid-template-areas: "label" "name" "meta" "desc" "cta"; }
  #v-amberlit .ilabel { padding-top: 0; margin-bottom: 0.3rem; }
  /* Once the panel is one column the key belongs on the left edge with
   * everything else; kept at justify-self:end it floats away from the text. */
  #v-amberlit .icta { justify-self: start; align-self: start; margin-top: 1.1rem; }
  #v-amberlit .sample-row { gap: 1rem; }
}


/* ===== variants/coldmk2.css ===== */
/* 04 — Cold Terminal Mk II
 *
 * The recommendation, built. Cold Terminal is the base, and three things are
 * taken from elsewhere in the gallery — nothing else changes, so a diff of
 * this against cold.css is exactly the size of the argument:
 *
 *   1. AMBER MONITOR'S ROOMINESS AND LARGER TYPE. The reference grid is
 *      tighter than it needs to be. 19px → 22px, 940px → 1080px, and the
 *      six-across matrix becomes three-by-two.
 *   2. VECTOR NEON'S GLOW DISCIPLINE. Cold sets one flat green shadow wherever
 *      something should look lit. Vector tunes it per element and gives body
 *      copy none at all. That is a legibility rule, not a taste one.
 *   3. CRT TEXTURE AT "AS MOCKED", NEVER HEAVY, AND NOT BEHIND THE BOARDS.
 *      The gallery's own measurement says heavy texture costs about 35% more
 *      glyph size to stay readable, which a 16×30 Minesweeper board cannot
 *      afford. So heavy is not offered on this variant at all — the caption
 *      control has three settings instead of four — and the boards are lifted
 *      out from under the texture entirely.
 *
 * What is deliberately NOT taken: Amber's warm ground, its sentence case, its
 * bloom, and its outlined CTA. This is still Cold Terminal — one phosphor
 * green on near-black, everything upper case, nothing rounded, a filled key.
 * The hairline matrix survives too; it is Cold's signature and the roominess
 * is spent on bigger cells inside it rather than on turning it into six
 * floating cards.
 */

#v-coldmk2 {
  --bg: #040604;
  --panel: #070c07;
  --green: #33ff66;
  --dim: #1f9e46;
  --dimmer: #14612d;
  --line: #143a20;

  --amber: #ffb000;
  --cyan: #3fd4ff;
  --magenta: #ff4dd8;
  --red: #ff3b3b;

  /* --- Borrowed from Vector Neon: a reading tint.
   *
   * The temptation in a phosphor direction is to set body copy in the accent.
   * On black that gives fully saturated green text, which vibrates and is
   * genuinely tiring to read — Vector's file says so about its cyan and it is
   * just as true of this green. This is --green desaturated toward white until
   * it stops fighting the eye. Everything that is a sentence uses it; nothing
   * that is a sentence uses --green.
   *
   * Cold sets .idesc to rgba(51, 255, 102, 0.78), which is the same colour
   * made dimmer rather than calmer — it keeps every bit of the saturation and
   * loses the contrast. This keeps the contrast and drops the saturation,
   * which is the other way round and the right way round. */
  --read: #c8f5d6;
  --read-dim: #7fae90;

  /* --- Borrowed from Vector Neon: glow as a scale, not a switch.
   *
   * Three levels and a rule for each, rather than one shadow reused wherever
   * something should look lit. Every one is layered — a tight near-white inner
   * plus a wide coloured outer — because a single flat shadow reads as a blur
   * and two layers read as light.
   *
   *   --glow-max   the wordmark, and nothing else on the page
   *   --glow-mid   the selected game's name, the key, the score
   *   --glow-min   small lit accents: the active nav item, the cursor
   *   (none)       anything that is a sentence, and every board digit
   *
   * The last line is the one that matters. Cold puts a glow on .inm and on
   * .pscore at the same strength as the wordmark; at 22px the wordmark can
   * carry it and a score cannot. */
  --glow-max:
    0 0 4px rgba(200, 255, 214, 0.55),
    0 0 14px rgba(51, 255, 102, 0.45),
    0 0 38px rgba(51, 255, 102, 0.22);
  --glow-mid:
    0 0 3px rgba(200, 255, 214, 0.4),
    0 0 12px rgba(51, 255, 102, 0.28);
  --glow-min: 0 0 8px rgba(51, 255, 102, 0.32);

  background: var(--bg);
  color: var(--read);
  font-family: 'VT323', ui-monospace, monospace;
  font-size: 22px;          /* borrowed: Amber's size, three steps up from 19 */
  line-height: 1.3;
}

#v-coldmk2 .deco {
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(51, 255, 102, 0.055), transparent 70%),
    radial-gradient(120% 100% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.6));
}

/* --- Borrowed from Amber Monitor: the room.
 *
 * z-index: auto rather than gallery.css's 2 is not a style change, it is what
 * makes borrowing 3 possible. At z-index 2 the screen is a stacking context
 * and nothing inside it can rise above the texture layer at 6, so no region of
 * the page can be lifted out from under the scanlines. Dropping the index lets
 * .sample do exactly that, further down. The screen still paints above .deco,
 * which sits at 0 and comes first in the DOM. */
#v-coldmk2 .screen {
  position: relative;
  z-index: auto;
  max-width: 1080px;
  margin: 0 auto;
  padding: 2.4rem 1.8rem 3.4rem;
}

/* ------------------------------------------------------------------- top */

#v-coldmk2 .top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  flex-wrap: wrap;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--line);
}

/* The only element on the page that gets --glow-max. A wordmark is the one
 * thing large enough for a wide glow to read as emission rather than as
 * softness. */
#v-coldmk2 .brand {
  font-size: 2.9rem;
  line-height: 1;
  letter-spacing: 0.08em;
  color: var(--green);
  text-shadow: var(--glow-max);
}

#v-coldmk2 .nav { display: flex; gap: 1.5rem; }

#v-coldmk2 .nav a {
  color: var(--dim);
  letter-spacing: 0.12em;
  font-size: 1.05rem;
  text-decoration: none;
  padding-bottom: 0.15rem;
  border-bottom: 1px solid transparent;
  transition: color 0.12s ease, border-color 0.12s ease;
}

#v-coldmk2 .nav a:hover { color: var(--read); outline: none; }

/* Marked by a rule as well as by colour, so the active item survives being
 * read in greyscale. */
#v-coldmk2 .nav a.active {
  color: var(--green);
  border-bottom-color: var(--green);
  text-shadow: var(--glow-min);
}

/* A sentence, so no glow — this is the borrowing doing its job. */
#v-coldmk2 .strap {
  margin: 1rem 0 1.9rem;
  color: var(--read-dim);
  letter-spacing: 0.1em;
  font-size: 1.05rem;
}

/* The cursor is not a sentence, so it keeps its light. Cold's hard 1.06s step
 * blink is kept exactly: this variant is the terminal, and a terminal cursor
 * does not fade. */
#v-coldmk2 .strap::after {
  content: "";
  display: inline-block;
  width: 0.52em;
  height: 1em;
  margin-left: 0.35em;
  background: var(--green);
  box-shadow: var(--glow-min);
  vertical-align: -0.14em;
  animation: coldmk2-blink 1.06s steps(1) infinite;
}

@keyframes coldmk2-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #v-coldmk2 .strap::after { animation: none; } }

/* ------------------------------------------------------------------ grid */

/* Three by two rather than six across, and the hairline matrix survives it:
 * gap 1px over a --line background is still the whole grid drawn as one ruled
 * table, which is Cold's signature and is not what was too tight. What was too
 * tight was the cell. At 1080px three columns are ~358px, which is enough to
 * carry the description — so the tile stops being an icon with a caption and
 * starts being a row in a catalogue.
 *
 * Cold hides .tdesc and keeps the description for the info panel, and that is
 * what buys its density. Once the cells are this size, hiding it leaves six
 * large boxes with almost nothing in them, so it comes back. The cost is
 * Amber's cost, stated in the same words: the info panel now largely repeats
 * the tile. What the panel still adds is the player count and the key. */
#v-coldmk2 .grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

#v-coldmk2 .tile {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas:
    "ico name"
    "ico desc"
    "ico cat";
  grid-template-rows: auto auto 1fr;
  column-gap: 1rem;
  padding: 1.3rem 1.2rem 1.1rem;
  background: var(--panel);
  color: var(--read-dim);
  text-decoration: none;
  transition: color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
}

#v-coldmk2 .tico {
  grid-area: ico;
  align-self: start;
  display: block;
  color: var(--dim);
  transition: color 0.12s ease, filter 0.12s ease;
}

#v-coldmk2 .ico { width: 42px; height: 42px; }

#v-coldmk2 .tname {
  grid-area: name;
  font-size: 1.55rem;
  line-height: 1.05;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--read);
  transition: color 0.12s ease, text-shadow 0.12s ease;
}

/* Shown, and given no glow whatsoever. */
#v-coldmk2 .tdesc {
  grid-area: desc;
  display: block;
  margin-top: 0.3rem;
  font-size: 1.02rem;
  line-height: 1.3;
  color: var(--read-dim);
}

#v-coldmk2 .tcat {
  grid-area: cat;
  align-self: end;
  margin-top: 0.65rem;
  font-size: 0.86rem;
  letter-spacing: 0.18em;
  color: var(--dimmer);
}

#v-coldmk2 .tnum {
  display: block;
  position: absolute;
  top: 0.5rem;
  right: 0.75rem;
  font-size: 0.86rem;
  color: var(--dimmer);
}

/* The inset rule is Cold's selection mark and it stays — in a 1px matrix an
 * outlined cell is the only selection that does not disturb the grid. The
 * outer bloom is cut to a third of Cold's: at this cell size the original
 * 16px at 0.16 spilled into the two neighbouring cells and made three tiles
 * look half-selected. That is glow tuned per element rather than per page. */
#v-coldmk2 .tile:hover,
#v-coldmk2 .tile:focus-visible,
#v-coldmk2 .tile.is-selected {
  background: #0b160e;
  outline: none;
  box-shadow: inset 0 0 0 1px var(--green), 0 0 10px rgba(51, 255, 102, 0.06);
}

#v-coldmk2 .tile:hover .tname,
#v-coldmk2 .tile:focus-visible .tname,
#v-coldmk2 .tile.is-selected .tname { color: var(--green); text-shadow: var(--glow-min); }

#v-coldmk2 .tile:hover .tico,
#v-coldmk2 .tile:focus-visible .tico,
#v-coldmk2 .tile.is-selected .tico {
  color: var(--green);
  filter: drop-shadow(0 0 8px rgba(51, 255, 102, 0.4));
}

#v-coldmk2 .tile:hover .tcat,
#v-coldmk2 .tile:focus-visible .tcat,
#v-coldmk2 .tile.is-selected .tcat,
#v-coldmk2 .tile:hover .tnum,
#v-coldmk2 .tile:focus-visible .tnum,
#v-coldmk2 .tile.is-selected .tnum { color: var(--dim); }

/* ------------------------------------------------------------ info panel */

/* Three columns with the key on the far right, borrowed from Amber. At 1080px
 * Cold's two-column panel leaves half the width empty and the block reads as
 * an accident rather than as space. */
#v-coldmk2 .info {
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas:
    "label name cta"
    "label meta cta"
    "label desc cta";
  column-gap: 1.5rem;
  align-items: start;
  margin-top: 2rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--line);
}

#v-coldmk2 .ilabel {
  grid-area: label;
  align-self: start;
  padding-top: 0.55rem;
  font-size: 0.9rem;
  letter-spacing: 0.16em;
  color: var(--dimmer);
}

/* --glow-mid, not --glow-max. Cold gives this the same shadow as the wordmark
 * at two thirds the size, and it turns to fuzz. */
#v-coldmk2 .inm {
  grid-area: name;
  font-size: 2.4rem;
  line-height: 1.1;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--green);
  text-shadow: var(--glow-mid);
}

#v-coldmk2 .imeta {
  grid-area: meta;
  margin-top: 0.15rem;
  font-size: 1rem;
  letter-spacing: 0.14em;
  color: var(--dim);
}

#v-coldmk2 .idesc {
  grid-area: desc;
  margin-top: 0.3rem;
  font-size: 1.2rem;
  color: var(--read);
}

/* Filled and inverted, which is Cold's and stays Cold's — Amber's outlined key
 * belongs to the quiet variant. Enlarged to match the type, and given the mid
 * glow rather than none: it is the one thing on the page you are meant to
 * press. */
#v-coldmk2 .icta {
  grid-area: cta;
  justify-self: end;
  align-self: center;
  padding: 0.24rem 1.2rem 0.18rem;
  font-size: 1.15rem;
  letter-spacing: 0.16em;
  color: var(--bg);
  background: var(--green);
  box-shadow: 0 0 18px rgba(51, 255, 102, 0.25);
}

#v-coldmk2 .info.is-launching .icta { animation: coldmk2-launch 0.14s steps(1) 5; }
@keyframes coldmk2-launch { 50% { background: var(--dim); } }

/* ---------------------------------------------------------- game samples */

/* --- Borrowed, third: the boards come out from under the texture.
 *
 * z-index 7 clears the .crt layer at 6, which only works because .screen gave
 * up its stacking context above. The opaque background is not decoration: the
 * texture still paints underneath, so without it the scanlines show straight
 * through the gaps between the cells and the exercise is pointless.
 *
 * The measured reason, from this gallery's own findings: a dark line every
 * 3.5px cuts two bands through a glyph at board size and saturated mid-tones
 * fragment, and the only fix found was cells about 35% larger — which a 16×30
 * Minesweeper board cannot afford. Texture is a chrome effect here. It belongs
 * on the parts of the page that are the machine, and not on the part that is
 * the game.
 *
 * A hairline above the strip so the flat area reads as a section rather than
 * as a hole where the texture stopped. */
#v-coldmk2 .sample {
  position: relative;
  z-index: 7;
  margin-top: 2.4rem;
  padding-top: 1.3rem;
  border-top: 1px solid var(--line);
  background: var(--bg);
}

#v-coldmk2 .sample-h {
  margin: 0 0 0.9rem;
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: 0.18em;
  color: var(--dimmer);
  text-transform: uppercase;
}

/* flex-start rather than the default stretch: the Minesweeper box is twice the
 * width of the others and was being pulled to their height. */
#v-coldmk2 .sample-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.3rem; }

#v-coldmk2 .sbox {
  flex: 0 0 auto;
  padding: 0.95rem 1.05rem 1.1rem;
  border: 1px solid var(--line);
  background: var(--panel);
}

#v-coldmk2 .sbox-h {
  display: block;
  margin-bottom: 0.7rem;
  font-size: 0.9rem;
  letter-spacing: 0.16em;
  color: var(--dimmer);
  text-transform: uppercase;
}

/* Cells grow with the type. Cold's 30px cell was sized for 19px text. */
#v-coldmk2 .sgrid {
  display: grid;
  grid-template-columns: repeat(3, 38px);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

#v-coldmk2 .scell {
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--panel);
  font-size: 1.45rem;
  color: var(--dim);
}

#v-coldmk2 .scell.given { color: var(--green); }
#v-coldmk2 .scell.entered { color: var(--cyan); }
#v-coldmk2 .scell.sel { background: #10331c; box-shadow: inset 0 0 0 2px var(--green); }

#v-coldmk2 .mgrid {
  display: flex;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

#v-coldmk2 .mcell {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  background: #0d1a10;
  font-size: 1.45rem;
}

/* Cold's eight, unchanged and not up for revision — they are the strongest
 * argument the direction has. Real monitor phosphors borrowed rather than web
 * colours invented, hue carrying all eight, and no second device needed.
 *
 * The glow discipline reaches them though, by saying nothing: not one of these
 * has a text-shadow. Eight glowing digits side by side bleed into each other
 * and the separation the hues bought is spent on blur. */
#v-coldmk2 .n1 { color: var(--cyan); }
#v-coldmk2 .n2 { color: var(--green); }
#v-coldmk2 .n3 { color: var(--amber); }
#v-coldmk2 .n4 { color: var(--magenta); }
#v-coldmk2 .n5 { color: #ff5a4d; }
#v-coldmk2 .n6 { color: #24d9a8; }
#v-coldmk2 .n7 { color: #ffffff; }
#v-coldmk2 .n8 { color: #9db3a4; }

#v-coldmk2 .mcell.flag { color: var(--red); }
#v-coldmk2 .mcell.hidden-cell { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }

#v-coldmk2 .pbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 1.5rem;
  letter-spacing: 0.1em;
}

/* No glow. A two-digit score at 1.5rem is small enough that a shadow costs it
 * a stroke, and it is on a panel of its own where nothing competes with it. */
#v-coldmk2 .pscore { color: var(--green); font-variant-numeric: tabular-nums; }
#v-coldmk2 .plabel { color: var(--dimmer); font-size: 0.9rem; letter-spacing: 0.16em; }
#v-coldmk2 .pdiv { flex: 0 0 30px; height: 1px; background: var(--line); }

#v-coldmk2 .pcourt {
  position: relative;
  height: 52px;
  margin-top: 0.6rem;
  border: 1px solid var(--line);
  background: #060b07;
}

#v-coldmk2 .pcourt::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 3px;
  bottom: 3px;
  border-left: 1px dashed var(--dimmer);
}

/* The paddles keep their light — they are the two objects on the page whose
 * whole job is to be found instantly, and they are 3px wide, which is the case
 * a glow is actually for. */
#v-coldmk2 .ppad { position: absolute; top: 11px; width: 3px; height: 24px; background: var(--green); }
#v-coldmk2 .ppad.l { left: 7px; box-shadow: var(--glow-min); }
#v-coldmk2 .ppad.r { right: 7px; top: 19px; background: var(--red); box-shadow: 0 0 8px rgba(255, 59, 59, 0.35); }
#v-coldmk2 .pball { position: absolute; left: 62%; top: 22px; width: 5px; height: 5px; background: #ffffff; box-shadow: var(--glow-min); }

/* ----------------------------------------------------------------- foot */

#v-coldmk2 .foot {
  margin-top: 2.8rem;
  padding-top: 0.9rem;
  border-top: 1px solid var(--line);
  font-size: 0.95rem;
  letter-spacing: 0.13em;
  color: var(--dimmer);
}

/* -------------------------------------------------------------- narrower */

@media (max-width: 760px) {
  #v-coldmk2 { font-size: 20px; }
  #v-coldmk2 .screen { padding: 1.7rem 1.1rem 2.4rem; }
  #v-coldmk2 .brand { font-size: 2.2rem; }
  #v-coldmk2 .inm { font-size: 2rem; }
  #v-coldmk2 .info { grid-template-columns: 1fr; grid-template-areas: "label" "name" "meta" "desc" "cta"; }
  #v-coldmk2 .ilabel { padding-top: 0; margin-bottom: 0.3rem; }
  #v-coldmk2 .icta { justify-self: start; align-self: start; margin-top: 1rem; }
  #v-coldmk2 .sample-row { gap: 1rem; }
}


/* ===== variants/vector.css ===== */
/* 03 — Vector Neon
 *
 * Not a raster screen. Asteroids, Tempest, Battlezone: an oscilloscope with a
 * game attached, where the beam is steered along the shape rather than swept
 * across a raster. Three consequences drive every value in this file.
 *
 * 1. The unlit screen is genuinely #000000. There is no "off" pixel to be
 *    slightly grey — nothing is drawn there, so nothing is emitted. The near-
 *    black grounds the other phosphor variants use would be a lie here.
 * 2. Nothing is filled. A vector display can only draw strokes; a solid
 *    rectangle costs it a raster it does not have. So every box on this page
 *    is an outline, at 1px, and the only exception is the CTA — see there.
 * 3. The beam is white at the core and bleeds its colour outward. One flat
 *    text-shadow reads as a blur; a near-white inner plus one or two wide
 *    coloured outers reads as light. Every glow here is layered that way, and
 *    tuned per element — strong on the wordmark, near-nothing on body text.
 *
 * CRT texture is off for this variant and should stay off: scanlines are the
 * artefact of the display this direction is explicitly not.
 */

#v-vector {
  --ink: #000000;      /* the ground, and the text colour inside the one filled element */
  --ice: #3fd4ff;      /* primary beam */
  --mag: #ff4dd8;      /* second beam: category accent, flags, the opponent */
  --hot: #ffffff;      /* the beam core, and the hottest elements */

  /* Two dimmed ices for structure. Anything a hairline is drawn in comes from
   * here; body text never does — see the note on --read below. */
  --line: #14556b;     /* resting hairline: visible on black, recedes at once */
  --line-hi: #2a9dc4;  /* a rule that is doing work */

  /* Reading tint. The temptation in a glow direction is to set body copy in the
   * accent, which on black gives saturated 100%-blue text that vibrates and is
   * genuinely tiring. This is --ice desaturated toward white until it stops
   * fighting the eye, and it is what the strap, .idesc and the footer use. */
  --read: #bfeaff;
  --read-dim: #79b6cd;

  --icon-hole: #000000;  /* the mine icon punches its highlight with this */

  background: var(--ink);
  color: var(--read);
  font-family: 'VT323', ui-monospace, monospace;
  font-size: 20px;
