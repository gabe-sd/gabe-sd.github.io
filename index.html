<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Arcade</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>
  <main class="page">
    <h1>🎮 Game Arcade</h1>
    <p class="status">Pick a game to play</p>
    <div class="game-grid">
      <a class="game-card" href="games/tic-tac-toe/index.html">
        <span class="game-icon">⭕</span>
        <span class="game-name">Tic Tac Toe</span>
        <span class="game-desc">Classic 3x3, two players</span>
      </a>
      <a class="game-card" href="games/pong/index.html">
        <span class="game-icon">🏓</span>
        <span class="game-name">Pong</span>
        <span class="game-desc">You vs. the AI paddle</span>
      </a>
      <a class="game-card" href="games/minesweeper/index.html">
        <span class="game-icon">💣</span>
        <span class="game-name">Minesweeper</span>
        <span class="game-desc">Clear the board, avoid the mines</span>
      </a>
      <a class="game-card" href="games/chess/index.html">
        <span class="game-icon">♟️</span>
        <span class="game-name">Chess</span>
        <span class="game-desc">Full rules, two players, local pass-and-play</span>
      </a>
    </div>
  </main>
</body>
</html>
